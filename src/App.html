        });
        break;
      case 'mode':
        enterMode(el.getAttribute('data-mode'));
        break;
      case 'admin':
        adminLogin();
        break;
      case 'back': {
        var to = el.getAttribute('data-to');
        var p = {};
        try { p = JSON.parse(el.getAttribute('data-p') || '{}'); } catch (e) { p = {}; }
        if (S.view === 'entry') S.entry = null;
        if (to === 'home' || to === 'tlist') S.mode = null;
        if (to === 'sys') S.mode = 'sys';
        go(to, p);
        break;
      }
      case 'tab':
        S.selectTab = el.getAttribute('data-tab');
        render();
        if (S.selectTab === 'name') { var si = document.getElementById('search'); if (si) si.focus(); }
        break;
      case 'reload-boot':
        loadBoot().then(render).catch(showError);
        break;
      case 'open-league':
        openLeague(Number(el.getAttribute('data-league')), null);
        break;
      case 'open-player':
        openLeague(Number(el.getAttribute('data-league')), Number(el.getAttribute('data-num')));
        break;
      case 'focus': {
        var num = Number(el.getAttribute('data-num'));
        var f = S.params.focus === num ? null : num;
        go('league', { league: S.params.league, focus: f }, true);
        break;
      }
      case 'toggle-only':
        go('league', { league: S.params.league, focus: S.params.focus, only: S.params.only === false }, true);
        break;
      case 'refresh':
        if (S.view === 'bracket') {
          loadTour().then(function () { render(); toast('最新の状態に更新しました'); }).catch(showError);
          break;
        }
        loadLeague(S.params.league).then(function () { render(); toast('最新の結果に更新しました'); }).catch(showError);
        break;
      case 'phase':
        S.phase = el.getAttribute('data-phase');
        render();
        break;
      case 'open-bracket':
        openBracket(el.getAttribute('data-type'), null);
        break;
      case 'open-tplayer':
        openBracket(el.getAttribute('data-type'), Number(el.getAttribute('data-num')));
        break;
      case 'btab':
        go('bracket', { type: el.getAttribute('data-type'), focus: S.params.focus || null }, true);
        break;
      case 'tfocus-clear':
        go('bracket', { type: S.params.type }, true);
        break;
      case 'tsel': {
        var sid = el.getAttribute('data-id');
        if (S.tsel[sid]) delete S.tsel[sid]; else S.tsel[sid] = true;
        keepScroll(render);
        break;
      }
      case 'tsel-all': {
        var calledNow = (S.tour.board || []).filter(function (b) { var x = b.id && S.tour.byId[b.id]; return x && x.status === STATUS.NONE; }).map(function (b) { return b.id; });
        if (Object.keys(S.tsel).length === calledNow.length) S.tsel = {};
        else { S.tsel = {}; calledNow.forEach(function (id) { S.tsel[id] = true; }); }
        keepScroll(render);
        break;
      }
      case 'tstart':
        startSelected();
        break;
      case 'tmatch': {
        if (ev.target.closest('[data-act="tedit"]')) return;
        if (S.view === 'tpreview') return; // 確認画面では試合を開かない
        var tm = S.tour && S.tour.byId[el.getAttribute('data-id')];
        if (!tm) return;
        if (S.mode === 'player' && playable(tm) && tm.status !== STATUS.DONE) openEntry(tourCtx(tm), tm);
        else showDetail(tourCtx(tm), tm);
        break;
      }
      case 'tedit': {
        var tm2 = S.tour && S.tour.byId[el.getAttribute('data-id')];
        if (tm2) openEntry(tourCtx(tm2), tm2);
        break;
      }
      case 'adm-tour':
        adminPreviewTour();
        break;
      case 'tp-tab':
        S.preview.type = el.getAttribute('data-type');
        render();
        break;
      case 'tp-create':
        createFromPreview(false);
        break;
      case 'standings':
        go('standings', { league: S.params.league, focus: S.params.focus || null });
        break;
      case 'match': {
        if (ev.target.closest('[data-act="edit"]')) return; // 修正ボタンは別処理
        var m = L && findMatch(L, el.getAttribute('data-id'));
        if (!m) return;
        if (S.mode === 'player' && m.status !== STATUS.DONE && S.view === 'league') openEntry(leagueCtx(L), m);
        else showDetail(leagueCtx(L), m);
        break;
      }
      case 'edit': {
        var m2 = L && findMatch(L, el.getAttribute('data-id'));
        if (m2) openEntry(leagueCtx(L), m2);
        break;
      }
      case 'bestof': {
        var nbo = Number(el.getAttribute('data-v'));
        var cur = currentEntry();
        if (!cur || !S.entry) break;
        var extra = S.entry.sets.slice(nbo).some(function (x) { return String(x[0]).trim() !== '' || String(x[1]).trim() !== ''; });
        var applyBo = function () {
          for (var k = nbo; k < S.entry.sets.length; k++) S.entry.sets[k] = ['', ''];
          S.entry.bestOf = nbo;
          keepScroll(render);
        };
        if (!extra) { applyBo(); break; }
        modal({
          title: 'セット数を減らしますか？', icon: '⚠️',
          html: '<p>第' + (nbo + 1) + 'セット以降に入力された得点は消えます。</p>',
          buttons: [{ label: 'やめる', value: false, cls: 'ghost' }, { label: '減らす', value: true, cls: 'danger' }],
        }).then(function (ok) { if (ok) applyBo(); });
        break;
      }
      case 'prog':
        S.entry.progress = el.getAttribute('data-v');
        S.entry.autoDone = false;
        document.getElementById('prog').innerHTML = progHtml();
        break;
      case 'save':
        (function () { var ce = currentEntry(); if (ce) saveEntry(ce.ctx, ce.m); })();
        break;
      case 'reset':
        (function () { var ce = currentEntry(); if (ce) doReset(ce.ctx, ce.m); })();
        break;
      case 'adm-late':
        adminCall('adminAutoAssignLate').then(function (d) { S.admin = d; render(); showAutoAdded(d); }).catch(function () {});
        break;
      case 'participants':
        S.participants = null;
        go('participants', {});
        break;
      case 'part-reload':
        call('apiGetParticipants', S.tid).then(function (r) { S.participants = r; render(); toast('最新の参加者リストに更新しました'); }).catch(showError);
        break;
      case 'rules':
        loadBoot(true).then(function () { if (S.view === 'rules') render(); }).catch(function () {});
        go('rules', {});
        break;
      case 'adm-status': {
        var nst = el.getAttribute('data-v');
        if (nst === (S.admin.settings.status || '開催中')) break;
        var msg = { '開催前': '参加者リストとルールだけが見られる状態にします。試合の入力・閲覧はできなくなります。', '開催中': '試合の結果入力・閲覧ができるようにします（Webサイトを開放します）。', '終了': '結果の入力ができなくなり、閲覧のみになります。' };
        modal({
          title: '「' + nst + '」にしますか？', icon: nst === '開催中' ? '🚀' : 'ℹ️',
          html: '<p>' + esc(msg[nst]) + '</p>',
          buttons: [{ label: 'やめる', value: false, cls: 'ghost' }, { label: '「' + nst + '」にする', value: true, cls: nst === '開催中' ? 'accent' : 'primary' }],
        }).then(function (ok) {
          if (!ok) return;
          adminCall('adminSetStatus', nst).then(function (d) {
            S.admin = d; render(); toast('公開ステータスを「' + nst + '」にしました');
            loadBoot(true).catch(function () {});
            loadTournaments(true).catch(function () {});
          }).catch(function () {});
        });
        break;
      }
      case 'adm-info-save': {
        var info = {};
        document.querySelectorAll('#info-form [name]').forEach(function (x) { info[x.name] = x.value; });
        adminCall('adminSaveInfo', info).then(function (d) {
          S.admin = d; render(); toast('大会情報を保存しました'); loadBoot(true).catch(function () {});
        }).catch(function () {});
        break;
      }
      case 'mail-open':
        S.mail = null;
        go('mail', {});
        break;
      case 'mail-all': {
        mailSync();
        var gl = mailGroups().list, anyOff = gl.some(function (x) { return S.mail.excluded[x.email.toLowerCase()]; });
        S.mail.excluded = {};
        if (!anyOff) gl.forEach(function (x) { S.mail.excluded[x.email.toLowerCase()] = true; });
        keepScroll(render);
        break;
      }
      case 'mail-preview': {
        mailSync();
        var first = mailSelected()[0] || { names: ['（名前）'], email: '' };
        modal({ title: '内容の確認', icon: '👀', html: '<div class="small muted">宛先の例: ' + esc(first.names.join('・')) + (first.email ? ' &lt;' + esc(first.email) + '&gt;' : '') + '</div>' +
          '<div class="mail-preview"><b>' + esc(mailPersonal(S.mail.subject, first.names) || '（件名なし）') + '</b><hr>' + esc(mailPersonal(S.mail.body, first.names) || '（本文なし）').replace(/\n/g, '<br>') + '</div>',
          buttons: [{ label: '閉じる', value: true, cls: 'primary' }] });
        break;
      }
      case 'mail-test': {
        mailSync();
        var tto = String(S.mail.testTo || '').trim();
        if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(tto)) { alertBox('テストの送信先', '<p>テストの送信先のメールアドレスを入力してください。</p>'); break; }
        if (!S.mail.subject.trim() || !S.mail.body.trim()) { alertBox('入力してください', '<p>件名と本文を入力してください。</p>'); break; }
        var ex = mailSelected()[0];
        mailSendAll([{ email: tto, names: ex ? ex.names : ['テスト'] }], true).then(function (res) { mailResultBox(res, 'テスト送信の結果'); }).catch(showError);
        break;
      }
      case 'mail-send': {
        mailSync();
        var targets = mailSelected();
        if (!targets.length) break;
        if (!S.mail.subject.trim() || !S.mail.body.trim()) { alertBox('入力してください', '<p>件名と本文を入力してください。</p>'); break; }
        modal({
          title: targets.length + ' 件にメールを送信しますか？', icon: '📧',
          html: '<p>件名: <b>' + esc(S.mail.subject) + '</b></p><p class="small muted">送信元: ' + esc(S.mail.info.fromName) + ' &lt;' + esc(S.mail.info.from) + '&gt;</p>' +
            '<p class="small">送信したメールは取り消せません。先にテスト送信で内容を確認することをおすすめします。</p>',
          buttons: [{ label: 'やめる', value: false, cls: 'ghost' }, { label: '送信する', value: true, cls: 'accent' }],
          dismissable: false,
        }).then(function (ok) {
          if (!ok) return;
          mailSendAll(targets, false).then(function (res) { mailResultBox(res, '送信が完了しました'); })
            .catch(function (e) { showError(e); if (e.partial && e.partial.length) mailResultBox(e.partial, '途中まで送信しました'); });
        });
        break;
      }
      case 'adm-rules-save':
        adminCall('adminSaveRules', document.getElementById('adm-rules').value).then(function (d) {
          S.admin = d; render(); toast('ルールを保存しました'); loadBoot(true).catch(function () {});
        }).catch(function () {});
        break;
      case 'adm-rules-preview':
        modal({ title: 'ルール（表示の確認）', icon: '📖', html: '<div class="rules">' + (rulesHtml(document.getElementById('adm-rules').value) || '<p class="muted">（空です）</p>') + '</div>', buttons: [{ label: '閉じる', value: true, cls: 'primary' }] });
        break;
      case 'adm-reload':
        adminReload().catch(function () {});
        break;
      case 'adm-assign':
        adminCall('adminAutoAssign').then(function (r) {
          return alertBox('くじ番号を割り当てました', r.assigned.length ? '<ul>' + r.assigned.map(function (a) { return '<li>' + a.num + '番: ' + esc(withTeam(a.name, a.team)) + '</li>'; }).join('') + '</ul><p class="small muted">「参加者」シートに書き込みました。</p>' : '<p>割り当てが必要な選手はいませんでした。</p>', '🎲');
        }).then(adminReload).catch(function () {});
        break;
      case 'adm-save': {
        var f2 = adminForm();
        adminCall('adminSaveSettings', f2).then(function (d) {
          if (f2.adminPassword) S.adminPw = f2.adminPassword;
          S.admin = d;
          render();
          toast('設定を保存しました');
          loadBoot(true).catch(function () {});
        }).catch(function () {});
        break;
      }
      case 'adm-rec': {
        var inp = document.querySelector('#adm-form input[name="leagueCount"]');
        inp.value = el.getAttribute('data-v');
        updatePreview();
        break;
      }
      case 'adm-create':
        adminCreate(false);
        break;
      case 'adm-add': {
        var n = Number(document.getElementById('add-num').value);
        var lg = Number(document.getElementById('add-league').value);
        adminCall('adminAddPlayer', n, lg).then(function (r) {
          S.leagues = {};
          loadBoot(true).catch(function () {});
          toast(withTeam(r.name, r.team) + ' さんをリーグ' + r.league + 'に追加しました（' + r.added + '試合）');
          return adminReload();
        }).catch(function () {});
        break;
      }
      case 'adm-export':
        adminCall('adminExportStandings').then(function () { toast('「順位」シートを更新しました'); }).catch(function () {});
        break;
      case 'adm-cache':
        adminCall('adminClearCache').then(function () { S.leagues = {}; toast('キャッシュをクリアしました'); }).catch(function () {});
        break;
    }
  });

  document.addEventListener('input', function (ev) {
    var t = ev.target;
    if (S.view === 'mail' && S.mail) {
      if (t.id === 'mail-filter') { mailSync(); S.mail.filter = t.value; S.mail.excluded = {}; keepScroll(render); return; }
      if (t.id === 'mail-nowd') { mailSync(); S.mail.noWd = t.checked; keepScroll(render); return; }
      if (t.classList && t.classList.contains('mail-chk')) {
        mailSync();
        var em = t.getAttribute('data-email');
        if (t.checked) delete S.mail.excluded[em]; else S.mail.excluded[em] = true;
        keepScroll(render);
        return;
      }
    }
    if (t.id === 'psearch' && S.participants) {
      S.psearch = t.value;
      document.getElementById('plist').innerHTML = participantsListHtml(S.participants, t.value.trim().toLowerCase());
      return;
    }
    if (t.id === 'search') {
      S.search = t.value;
      document.getElementById('name-list').innerHTML = nameListHtml();
      return;
    }
    if (ev.isComposing) return; // 日本語入力の変換中は確定してから処理する
    if (t.hasAttribute && t.hasAttribute('data-set') && S.entry) {
      normalizeScoreInput(t);
      return;
    }
    if (t.hasAttribute && t.hasAttribute('data-num')) normalizeNumInput(t);
    if (t.closest && t.closest('#adm-form')) updatePreview();
  });

  /** 得点の入力欄: 全角→半角、数字以外を削除、最大2桁 */
  function normalizeScoreInput(t) {
    var i = Number(t.getAttribute('data-set'));
    var side = Number(t.getAttribute('data-side'));
    var v = toDigits(t.value, 2);
    S.entry.sets[i][side] = v;
    if (t.value !== v) t.value = v;
    var ce2 = currentEntry();
    if (ce2) { updateCalc(ce2.m); autoProgress(ce2.m); }
  }

  function normalizeNumInput(t) {
    var v = toDigits(t.value, 3);
    if (t.value !== v) t.value = v;
  }

  var onFix = function (ev) {
    var t = ev.target;
    if (!t.hasAttribute) return;
    if (t.hasAttribute('data-set') && S.entry) normalizeScoreInput(t);
    else if (t.hasAttribute('data-num')) { normalizeNumInput(t); if (t.closest('#adm-form')) updatePreview(); }
  };
  document.addEventListener('compositionend', onFix);
  document.addEventListener('change', onFix);
  document.addEventListener('blur', onFix, true);

  // Enter キーで次の入力欄へ
  document.addEventListener('keydown', function (ev) {
    if (ev.key !== 'Enter' || ev.isComposing || ev.keyCode === 229 || !ev.target.hasAttribute || !ev.target.hasAttribute('data-set')) return;
    ev.preventDefault();
    var inputs = Array.prototype.slice.call(app.querySelectorAll('input[data-set]'));
    var idx = inputs.indexOf(ev.target);
    if (idx >= 0 && idx + 1 < inputs.length) inputs[idx + 1].focus();
    else ev.target.blur();
  });

  /** スクロール位置（縦・トーナメント表の横）を保ったまま再描画 */
  function keepScroll(fn) {
    var y = window.scrollY;
    var bw = document.getElementById('bracket-wrap');
    var x = bw ? bw.scrollLeft : 0;
    fn();
    window.scrollTo(0, y);
    bw = document.getElementById('bracket-wrap');
    if (bw) bw.scrollLeft = x;
  }

  /** 選択した呼び出し中の試合をまとめて「試合中」にする */
  function startSelected() {
    var ids = Object.keys(S.tsel);
    if (!ids.length) return;
    var list = ids.map(function (id) { return S.tour.byId[id]; }).filter(Boolean).sort(function (a, b) { return a.table - b.table; });
    modal({
      title: list.length + '試合を「試合中」にしますか？', icon: '▶',
      html: '<ul class="list-plain">' + list.map(function (m) {
        return '<li><b>台' + m.table + '</b> ' + esc(m.type) + 'T ' + esc(m.roundName) + '：' + esc(m.n1) + ' vs ' + esc(m.n2) + '</li>';
      }).join('') + '</ul>',
      buttons: [{ label: 'やめる', value: false, cls: 'ghost' }, { label: '試合中にする', value: true, cls: 'accent' }],
    }).then(function (ok) {
      if (!ok) return;
      busy(true);
      call('apiStartTMatches', S.tid, ids, S.entryCode, clientMeta()).then(function (res) {
        busy(false);
        S.tour = decorateTour(res.tour);
        S.tsel = {};
        keepScroll(render);
        toast(res.started.length + '試合を「試合中」にしました' + (res.skipped.length ? '（' + res.skipped.length + '試合は既に変更済みのため対象外）' : ''));
      }).catch(function (e) { busy(false); showError(e); });
    });
  }

  function openBracket(type, focus) {
    var p = { type: type, focus: focus || null };
    if (S.tour) {
      go('bracket', p);
      loadTour(true).then(function () { if (S.view === 'bracket') render(); }).catch(function () {});
    } else {
      loadTour().then(function () { go('bracket', p); }).catch(showError);
    }
  }

  function openLeague(no, focus) {
    var p = { league: no, focus: focus || null };
    // キャッシュがあっても開くたびに最新を取りに行く
    if (S.leagues[no]) {
      go('league', p);
      loadLeague(no, true).then(function () { if (S.view === 'league' && S.params.league === no) render(); }).catch(function () {});
    } else {
      loadLeague(no).then(function () { go('league', p); }).catch(showError);
    }
  }

  // 自動更新（入力画面・ダイアログ表示中は行わない）
  setInterval(function () {
    if (document.visibilityState !== 'visible' || S.modalOpen) return;
    if (S.view === 'league' || S.view === 'standings') {
      var no = S.params.league;
      loadLeague(no, true).then(function () {
        if (!S.modalOpen && (S.view === 'league' || S.view === 'standings') && S.params.league === no) {
          var y = window.scrollY;
          render();
          window.scrollTo(0, y);
        }
      }).catch(function () {});
    } else if (S.view === 'bracket') {
      loadTour(true).then(function () {
        if (S.view !== 'bracket' || S.modalOpen) return;
        var y = window.scrollY;
        var bw = document.getElementById('bracket-wrap');
        var x = bw ? bw.scrollLeft : 0;
        render();
        window.scrollTo(0, y);
        bw = document.getElementById('bracket-wrap');
        if (bw) bw.scrollLeft = x;
      }).catch(function () {});
    } else if (S.view === 'select') {
      loadBoot(true).then(function () {
        if (S.view === 'select' && !S.modalOpen && (S.selectTab === 'league' || (S.boot.hasTournament && S.phase !== 'league')) && document.activeElement && document.activeElement.id !== 'search') render();
      }).catch(function () {});
    }
  }, REFRESH_MS);

  /* ---------------- start ---------------- */

  function start(param) {
    loadTournaments(true).then(function () {
      if (param) {
        return call('apiGetTournament', param).then(function (t) {
          if (!t) { go('tlist', {}, true); return alertBox('大会が見つかりません', '<p>リンクの大会は削除された可能性があります。一覧から選んでください。</p>'); }
          switchTournament(t);
          return loadBoot(true).then(function () { go('home', {}, true); });
        });
      }
      go('tlist', {}, true);
    }).catch(function (e) {
      go('tlist', {}, true);
      showError(e);
    });
  }

  // URL に ?t=大会ID があれば、その大会を直接開く
  try {
    google.script.url.getLocation(function (loc) {
      // 独自ドメイン（Cloudflare Worker）経由のときは、署名付きのアクセス元情報が付いてくる（更新ログ用）
      if (loc && loc.parameter && loc.parameter.cfp) S.cfp = String(loc.parameter.cfp);
      start(loc && loc.parameter && loc.parameter.t ? String(loc.parameter.t) : '');
    });
  } catch (e) {
    start('');
  }
})();
</script>
