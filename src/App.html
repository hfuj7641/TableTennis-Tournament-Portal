<script>
(function () {
  'use strict';

  var STATUS = { NONE: '未実施', PROGRESS: '試合中', DONE: '終了' };
  var MAX_SETS = 7;
  var REFRESH_MS = 45000;

  var S = {
    mode: null,          // 'player' | 'viewer' | 'admin'
    tid: null,           // 選択中の大会ID
    tournament: null,    // { id, name, date }
    tournaments: null,   // 大会一覧
    masterSet: true,     // システム管理者パスワードが設定済みか
    sysPw: '',
    sys: null,
    boot: null,
    leagues: {},         // no -> league data
    view: 'tlist',
    params: {},
    selectTab: 'league',
    phase: 'tour',       // 選択画面: 'tour' | 'league'
    tour: null,          // トーナメントのデータ
    preview: null,       // トーナメント作成前の確認データ
    tsel: {},            // 一括で試合中にするために選んだ試合ID
    search: '',
    entryCode: '',
    adminPw: '',
    admin: null,
    entry: null,         // 入力中の状態
    modalOpen: false,
  };

  var app = document.getElementById('app');

  /* ---------------- utilities ---------------- */

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function call(fn) {
    var args = Array.prototype.slice.call(arguments, 1);
    return new Promise(function (resolve, reject) {
      var runner = google.script.run
        .withSuccessHandler(function (r) {
          if (typeof r === 'string') {
            try { resolve(JSON.parse(r)); } catch (e) { resolve(r); }
          } else resolve(r);
        })
        .withFailureHandler(function (e) { reject(e); });
      runner[fn].apply(runner, args);
    });
  }

  function errMsg(e) {
    var m = (e && (e.message || e)) || 'エラーが発生しました';
    return String(m).replace(/^Exception:\s*/, '').replace(/^Error:\s*/, '');
  }

  function busy(on) { document.getElementById('busy').hidden = !on; }

  var toastTimer;
  function toast(msg) {
    var t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.classList.remove('show'); }, 2600);
  }

  function store(k, v) {
    try { if (v === undefined) return sessionStorage.getItem(k); sessionStorage.setItem(k, v); } catch (e) { return null; }
  }

  /** 「名前（所属）」の形にする */
  function withTeam(name, team) {
    name = String(name == null ? '' : name);
    team = String(team == null ? '' : team).trim();
    return team ? name + '（' + team + '）' : name;
  }

  /** サーバーから受け取ったリーグのデータの名前を「名前（所属）」にする */
  function decorate(L) {
    if (!L || L._decorated) return L;
    var team = {};
    L.players.forEach(function (p) { team[p.num] = p.team || ''; p.label = withTeam(p.name, p.team); });
    L.matches.forEach(function (m) {
      m.r1 = m.n1; m.t1 = team[m.p1] || ''; m.r2 = m.n2; m.t2 = team[m.p2] || '';
      m.n1 = withTeam(m.r1, m.t1); m.n2 = withTeam(m.r2, m.t2);
    });
    (L.standings || []).forEach(function (s) { s.label = withTeam(s.name, s.team); });
    L._decorated = true;
    return L;
  }

  /** 試合の選手名を HTML で（名前と（所属）がそれぞれ途中で改行されないように） */
  function nameHtml(m, side) {
    var n = side === 1 ? m.r1 : m.r2, t = side === 1 ? m.t1 : m.t2;
    if (n === undefined) return esc(side === 1 ? m.n1 : m.n2);
    var html = '<span class="nb">' + esc(n) + '</span>' + (t ? '<span class="nb team">（' + esc(t) + '）</span>' : '');
    if (side === 1 ? m.w1 : m.w2) html = '<span class="badge wdb">棄権</span> <span class="wd">' + html + '</span>';
    return html;
  }

  /** 端末番号（ブラウザごとにランダムに作って保存。更新ログ用） */
  function deviceId() {
    var id = '';
    try { id = localStorage.getItem('deviceId') || ''; } catch (e) { /* ignore */ }
    if (!id) {
      id = 'D' + Math.random().toString(36).slice(2, 8).toUpperCase() + Date.now().toString(36).slice(-3).toUpperCase();
      try { localStorage.setItem('deviceId', id); } catch (e) { S._deviceId = S._deviceId || id; id = S._deviceId; }
    }
    return id;
  }

  /** 更新ログに残す画面の情報 */
  function clientMeta() {
    return { __meta: true, device: deviceId(), ua: String(navigator.userAgent || '').slice(0, 200), cfp: S.cfp || '' };
  }

  function randomKey(n) {
    var chars = 'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnpqrstuvwxyz23456789', key = '';
    var rnd = new Uint32Array(n);
    try { crypto.getRandomValues(rnd); } catch (e) { for (var q = 0; q < n; q++) rnd[q] = Math.floor(Math.random() * 4294967295); }
    for (var k = 0; k < n; k++) key += chars.charAt(rnd[k] % chars.length);
    return key;
  }

  /** 全角数字を半角にして、数字以外を取り除く */
  function toDigits(v, maxLen) {
    var d = String(v == null ? '' : v)
      .replace(/[０-９]/g, function (c) { return String.fromCharCode(c.charCodeAt(0) - 0xfee0); })
      .replace(/[^0-9]/g, '');
    return maxLen ? d.slice(0, maxLen) : d;
  }

  function need(bestOf) { return Math.floor(bestOf / 2) + 1; }

  function validGame(x, y) {
    var w = Math.max(x, y), l = Math.min(x, y);
    return (w === 11 && l <= 9) || (w > 11 && w - l === 2);
  }

  function setsText(sets) {
    return (sets || []).map(function (s) { return s[0] + '-' + s[1]; }).join(', ');
  }

  function statusClass(st) { return st === STATUS.DONE ? 'done' : st === STATUS.PROGRESS ? 'progress' : 'none'; }

  function findMatch(L, id) {
    for (var i = 0; i < L.matches.length; i++) if (L.matches[i].id === id) return L.matches[i];
    return null;
  }

  function fmtRate(s) { return s.played ? (Math.round((s.wins / s.played) * 1000) / 10).toFixed(1) + '%' : '-'; }
  function fmtRatio(s) {
    if (s.ratioInf) return '♾️';
    if (!s.played) return '-';
    return (Math.round(s.ratio * 100) / 100).toFixed(2);
  }

  /* ---------------- modal ---------------- */

  /**
   * opts: { title, icon, html, buttons: [{label, value, cls}] }
   * 戻り値: 押されたボタンの value（背景タップは null）
   */
  function modal(opts) {
    return new Promise(function (resolve) {
      var root = document.getElementById('modal-root');
      var bg = document.createElement('div');
      bg.className = 'modal-bg';
      var defs = opts.buttons || [{ label: 'OK', value: true, cls: 'primary' }];
      var btns = defs.map(function (b, i) {
        return '<button class="btn ' + (b.cls || '') + '" data-i="' + i + '">' + esc(b.label) + '</button>';
      }).join('');
      bg.innerHTML =
        '<div class="modal" role="dialog" aria-modal="true">' +
        '<h2>' + (opts.icon ? '<span>' + opts.icon + '</span>' : '') + esc(opts.title || '') + '</h2>' +
        '<div class="body">' + (opts.html || '') + '</div>' +
        '<div class="actions">' + btns + '</div></div>';
      S.modalOpen = true;
      var done = function (v) {
        S.modalOpen = false;
        root.removeChild(bg);
        resolve(v);
      };
      bg.addEventListener('click', function (ev) {
        if (ev.target === bg && opts.dismissable !== false) return done(null);
        var b = ev.target.closest('button[data-i]');
        if (b) {
          var def = defs[Number(b.getAttribute('data-i'))];
          if (opts.beforeClose) {
            var r = opts.beforeClose(def.value, bg);
            if (r === false) return;
          }
          done(def.value);
        }
      });
      root.appendChild(bg);
      if (opts.onOpen) opts.onOpen(bg);
    });
  }

  function alertBox(title, html, icon) {
    return modal({ title: title, icon: icon || '⚠️', html: html, buttons: [{ label: 'OK', value: true, cls: 'primary' }] });
  }

  /* ---------------- navigation ---------------- */

  var hasHistory = !!(window.google && google.script && google.script.history);

  function go(view, params, replace) {
    S.view = view;
    S.params = params || {};
    var state = { view: view, params: S.params, mode: S.mode, tid: S.tid };
    if (hasHistory) {
      try {
        if (replace) google.script.history.replace(state);
        else google.script.history.push(state);
      } catch (e) { /* ignore */ }
    }
    render();
    window.scrollTo(0, 0);
  }

  if (hasHistory) {
    google.script.history.setChangeHandler(function (e) {
      var st = e && e.state;
      if (st && st.view) {
        S.view = st.view;
        S.params = st.params || {};
        S.mode = st.mode || S.mode;
        if (st.tid && st.tid !== S.tid) {
          var t = (S.tournaments || []).filter(function (x) { return x.id === st.tid; })[0];
          if (t) { switchTournament(t); S.view = 'home'; S.params = {}; loadBoot(true).then(render).catch(showError); }
          else S.view = 'tlist';
        }
      } else {
        S.view = 'tlist';
        S.params = {};
      }
      if (S.view === 'admin' && !S.adminPw) S.view = S.tid ? 'home' : 'tlist';
      if (S.view === 'sys' && !S.sysPw) S.view = 'tlist';
      if (S.view !== 'tlist' && S.view !== 'sys' && !S.tid) S.view = 'tlist';
      render();
    });
  }

  function topbar(title, backTo, backParams) {
    var chip = S.mode === 'player' ? '<span class="chip player">選手用</span>'
      : S.mode === 'viewer' ? '<span class="chip viewer">閲覧用</span>'
      : S.mode === 'admin' ? '<span class="chip admin">管理者</span>'
      : S.mode === 'sys' ? '<span class="chip admin">システム管理</span>' : '';
    return '<div class="topbar"><div class="topbar-in">' +
      (backTo ? '<button class="back" data-act="back" data-to="' + esc(backTo) + '" data-p="' + esc(JSON.stringify(backParams || {})) + '">‹ 戻る</button>' : '') +
      '<h1>' + esc(title) + '</h1>' + chip + '</div></div>';
  }

  /* ---------------- data ---------------- */

  function loadBoot(silent) {
    if (!silent) busy(true);
    return call('apiGetBoot', S.tid).then(function (b) {
      S.boot = b;
      busy(false);
      return b;
    }).catch(function (e) {
      busy(false);
      throw e;
    });
  }

  function loadLeague(no, silent) {
    if (!silent) busy(true);
    return call('apiGetLeague', S.tid, no).then(function (L) {
      S.leagues[no] = decorate(L);
      busy(false);
      return S.leagues[no];
    }).catch(function (e) {
      busy(false);
      throw e;
    });
  }

  function showError(e) {
    alertBox('エラー', '<p>' + esc(errMsg(e)).replace(/\n/g, '<br>') + '</p>');
  }

  /* ---------------- render ---------------- */

  function render() {
    var v = S.view;
    if (v === 'tlist') return renderTournamentList();
    if (v === 'sys') return renderSys();
    if (!S.tid) return renderTournamentList();
    if (v === 'home') return renderHome();
    if (v === 'participants') return renderParticipants();
    if (v === 'rules') return renderRules();
    if (v === 'mail') return renderMail();
    if (tourStatus() === '開催前' && v !== 'admin' && v !== 'tpreview') { S.view = 'home'; return renderHome(); }
    if (v === 'select') return renderSelect();
    if (v === 'league') return withLeague(renderLeague);
    if (v === 'standings') return withLeague(renderStandings);
    if (v === 'bracket') return withTour(renderBracket);
    if (v === 'tpreview') return renderTPreview();
    if (v === 'entry') {
      if (S.params.kind === 'tour') return withTour(function () { var ce = currentEntry(); if (ce) renderEntry(ce.ctx, ce.m); else go('bracket', { type: S.params.type }, true); });
      return withLeague(function (L) { renderEntry(leagueCtx(L), findMatch(L, S.params.id)); });
    }
    if (v === 'admin') return renderAdmin();
    renderHome();
  }

  function withLeague(fn) {
    var no = S.params.league;
    if (S.leagues[no]) return fn(S.leagues[no]);
    app.innerHTML = topbar('リーグ ' + no, 'select') + '<div class="loading"><div class="spinner"></div>読み込み中…</div>';
    loadLeague(no, true).then(function () { render(); }).catch(showError);
  }

  /* ----- home ----- */

  function tourStatus() { return (S.boot && S.boot.status) || '開催中'; }

  function statusChip(st) {
    var cls = st === '開催前' ? 'pre' : st === '終了' ? 'ended' : 'open';
    return '<span class="stchip ' + cls + '">' + esc(st) + '</span>';
  }

  function renderHome() {
    var title = (S.boot && S.boot.title) || (S.tournament && S.tournament.name) || '卓球大会';
    var st = tourStatus();
    var html = topbar('', 'tlist') +
      '<div class="home" style="padding-top:24px">' +
      '<div class="hero-ball">🏓</div>' +
      '<h1>' + esc(title) + '</h1>' +
      '<p class="sub">' + (S.tournament && S.tournament.date ? esc(S.tournament.date) + ' ・ ' : '') + statusChip(st) + '</p>' + infoHtml();
    var info = '<div class="home-sub"><button class="mid-btn" data-act="participants">👥 参加者リスト</button><button class="mid-btn" data-act="rules">📖 ルール</button></div>';
    if (st === '開催前') {
      html += '<div class="notice info" style="text-align:left;margin-bottom:20px">この大会は<b>開催前</b>です。参加者リストとルールを確認できます。<br>試合の結果入力・閲覧は、大会当日に公開されます。</div>' +
        '<button class="big-btn viewer" data-act="participants"><span class="ico">👥</span><span><b>参加者リスト</b><small>参加予定の選手と所属を確認できます</small></span></button>' +
        '<button class="big-btn viewer" data-act="rules"><span class="ico">📖</span><span><b>ルール</b><small>大会のルール・注意事項</small></span></button>';
    } else if (st === '終了') {
      html += '<div class="notice info" style="text-align:left;margin-bottom:20px">この大会は<b>終了</b>しました。試合結果と順位を閲覧できます（結果の入力はできません）。</div>' +
        '<button class="big-btn viewer" data-act="mode" data-mode="viewer"><span class="ico">👀</span><span><b>結果を見る</b><small>試合結果・順位・トーナメント表</small></span></button>' + info;
    } else {
      html += '<p class="sub" style="margin-top:-20px">' + (S.boot && S.boot.hasTournament ? 'リーグ戦・トーナメント' : 'リーグ戦') + ' 試合結果ポータル</p>' +
        '<button class="big-btn player" data-act="mode" data-mode="player"><span class="ico">✍️</span><span><b>選手用（試合結果の入力）</b><small>自分の試合の結果を入力・修正できます</small></span></button>' +
        '<button class="big-btn viewer" data-act="mode" data-mode="viewer"><span class="ico">👀</span><span><b>結果確認用（保護者・観覧）</b><small>試合結果と順位を見ることができます（閲覧のみ）</small></span></button>' + info;
    }
    html += '<button class="admin-link" data-act="admin">この大会の管理者メニュー</button></div>';
    app.innerHTML = html;
  }

  /* ----- 大会情報 ----- */

  /** 連絡先: 電話番号はタップで発信、メールはタップでメール作成 */
  function contactHtml(text) {
    return esc(text).replace(/([\w.+-]+@[\w-]+(?:\.[\w-]+)+)|(\+\d[\d\-() ]{7,}\d|0\d[\d\-() ]{6,}\d)/g, function (m, mail, tel) {
      if (mail) return '<a href="mailto:' + mail + '">' + mail + '</a>';
      return '<a href="tel:' + tel.replace(/[^\d+]/g, '') + '">' + tel + '</a>';
    });
  }

  function infoHtml() {
    var I = (S.boot && S.boot.info) || {};
    var date = S.tournament && S.tournament.date;
    if (!date && !I.venue && !I.address && !I.startTime && !I.contact && !I.memo) return '';
    var row = function (icon, label, val) {
      return '<div class="info-row"><span class="info-ico">' + icon + '</span><span class="info-label">' + label + '</span><span class="info-val">' + val + '</span></div>';
    };
    var html = '<div class="card info-card">';
    if (date) html += row('📅', '開催日', esc(date));
    if (I.startTime) html += row('⏰', '開始時間', esc(I.startTime));
    if (I.venue) html += row('🏢', '場所', esc(I.venue));
    if (I.address || I.venue) {
      var q = encodeURIComponent(I.address || I.venue);
      if (I.address) html += row('📍', '住所', esc(I.address));
      html += '<div class="info-map"><a class="btn" href="https://www.google.com/maps/search/?api=1&query=' + q + '" target="_blank" rel="noopener">🗺️ Googleマップで開く</a></div>';
    }
    if (I.contact) html += row('📞', '当日の連絡先', contactHtml(I.contact));
    if (I.memo) html += '<div class="info-memo">' + esc(I.memo).replace(/\n/g, '<br>') + '</div>';
    return html + '</div>';
  }

  /* ----- 参加者リスト ----- */

  function renderParticipants() {
    var P = S.participants;
    var html = topbar('参加者リスト', 'home') + '<div class="wrap">';
    if (!P) {
      app.innerHTML = html + '<div class="loading"><div class="spinner"></div>読み込み中…</div></div>';
      call('apiGetParticipants', S.tid).then(function (r) { S.participants = r; if (S.view === 'participants') render(); }).catch(showError);
      return;
    }
    var q = (S.psearch || '').trim().toLowerCase();
    html += '<div class="summary"><span class="small">登録 <b>' + P.players.length + '</b> 名</span><span style="flex:1"></span>' +
      '<button class="icon-btn" data-act="part-reload" title="更新">🔄</button></div>' +
      '<input class="search" id="psearch" type="search" placeholder="名前・所属で検索" value="' + esc(S.psearch || '') + '" autocomplete="off" style="margin-top:12px">' +
      '<div class="name-list" id="plist">' + participantsListHtml(P, q) + '</div>' +
      '<p class="small muted" style="text-align:center;margin-top:16px">最終更新 ' + esc(P.generatedAt || '') + '</p></div>';
    app.innerHTML = html;
  }

  function participantsListHtml(P, q) {
    var list = P.players.map(function (p, i) { return { no: i + 1, p: p }; }).filter(function (x) {
      return !q || (x.p.name + ' ' + (x.p.team || '')).toLowerCase().indexOf(q) >= 0 || String(x.p.name).replace(/\s/g, '').toLowerCase().indexOf(q.replace(/\s/g, '')) >= 0;
    });
    if (!list.length) return '<div class="empty">' + (P.players.length ? '該当する選手がいません' : 'まだ参加者が登録されていません') + '</div>';
    return list.map(function (x) {
      var label = esc(x.p.name) + (x.p.team ? '<span class="team">（' + esc(x.p.team) + '）</span>' : '');
      return '<div class="name-item"><span class="num">' + x.no + '</span><span class="nm">' +
        (x.p.withdrawn ? '<span class="badge wdb">棄権</span> <span class="wd">' + label + '</span>' : label) + '</span></div>';
    }).join('');
  }

  /* ----- ルール ----- */

  /** ルールの文章を表示用 HTML に（# 見出し、- / ・ 箇条書き、空行で段落） */
  function rulesHtml(text) {
    var lines = String(text || '').replace(/\r/g, '').split('\n');
    var html = '', inList = false;
    var close = function () { if (inList) { html += '</ul>'; inList = false; } };
    lines.forEach(function (line) {
      var t = line.trim();
      if (!t) { close(); return; }
      var h = t.match(/^#{1,3}\s*(.+)$/);
      var li = t.match(/^(?:[-・*●]\s*)(.+)$/);
      if (h) { close(); html += '<h3>' + esc(h[1]) + '</h3>'; }
      else if (li) { if (!inList) { html += '<ul>'; inList = true; } html += '<li>' + esc(li[1]) + '</li>'; }
      else { close(); html += '<p>' + esc(t) + '</p>'; }
    });
    close();
    return html;
  }

  function renderRules() {
    var text = S.boot && S.boot.rules;
    app.innerHTML = topbar('ルール', 'home') + '<div class="wrap">' +
      (text ? '<div class="card rules" style="margin-top:16px">' + rulesHtml(text) + '</div>'
        : '<div class="card empty" style="margin-top:16px">ルールはまだ登録されていません。</div>') + '</div>';
  }

  function enterMode(mode) {
    var st = tourStatus();
    if (st === '開催前') return alertBox('まだ開催前です', '<p>試合の結果入力・閲覧は、大会当日（開催中）に公開されます。</p>', 'ℹ️');
    if (st === '終了' && mode === 'player') return alertBox('大会は終了しました', '<p>結果の入力はできません。「結果を見る」から閲覧できます。</p>', 'ℹ️');
    var proceed = function () {
      S.mode = mode;
      go('select', {});
    };
    if (mode !== 'player' || !S.boot || !S.boot.requiresEntryCode) return proceed();
    var saved = store('entryCode:' + S.tid);
    if (saved) { S.entryCode = saved; return proceed(); }
    modal({
      title: '選手入力パスコード',
      icon: '🔑',
      html: '<p class="small muted">大会スタッフから案内されたパスコードを入力してください。</p>' +
        '<input id="ec" class="search" type="text" autocomplete="off" inputmode="text" placeholder="パスコード">',
      buttons: [{ label: 'キャンセル', value: false, cls: 'ghost' }, { label: '入る', value: true, cls: 'accent' }],
      onOpen: function (bg) { setTimeout(function () { bg.querySelector('#ec').focus(); }, 50); },
      beforeClose: function (v, bg) {
        if (v) S._ec = bg.querySelector('#ec').value;
      },
    }).then(function (ok) {
      if (!ok) return;
      var code = String(S._ec || '').trim();
      busy(true);
      call('apiVerifyEntryCode', S.tid, code).then(function (r) {
        busy(false);
        if (r.ok) {
          S.entryCode = code;
          store('entryCode:' + S.tid, code);
          proceed();
        } else alertBox('パスコードが違います', '<p>もう一度入力してください。</p>');
      }).catch(function (e) { busy(false); showError(e); });
    });
  }

  /* ----- select ----- */

  function renderSelect() {
    var b = S.boot;
    var html = topbar(S.mode === 'player' ? '試合を選ぶ' : '結果を見る', 'home') + '<div class="wrap">';
    if (!b || !b.leagues.length) {
      html += '<div class="card empty" style="margin-top:16px">リーグ戦はまだ作成されていません。<br>しばらくお待ちください。<div style="margin-top:12px"><button class="btn" data-act="reload-boot">🔄 更新</button></div></div></div>';
      app.innerHTML = html;
      return;
    }
    var tourPhase = b.hasTournament && S.phase !== 'league';
    if (b.hasTournament) {
      html += '<div class="phase"><button class="' + (tourPhase ? 'on' : '') + '" data-act="phase" data-phase="tour">🏆 トーナメント</button>' +
        '<button class="' + (!tourPhase ? 'on' : '') + '" data-act="phase" data-phase="league">リーグ戦</button></div>';
    }
    if (tourPhase) {
      html += renderSelectTour(b);
      html += '<p class="small muted" style="text-align:center;margin-top:20px">最終更新 ' + esc(b.generatedAt || '') + ' <button class="btn ghost" data-act="reload-boot" style="min-height:auto;padding:2px 8px">🔄</button></p></div>';
      app.innerHTML = html;
      return;
    }
    html += '<div class="tabs"><button class="' + (S.selectTab === 'league' ? 'on' : '') + '" data-act="tab" data-tab="league">リーグ番号で選ぶ</button>' +
      '<button class="' + (S.selectTab === 'name' ? 'on' : '') + '" data-act="tab" data-tab="name">名前で選ぶ</button></div>';

    if (S.selectTab === 'league') {
      html += '<div class="league-grid">' + b.leagues.map(function (L) {
        var pct = L.total ? Math.round((L.done / L.total) * 100) : 0;
        var st = L.complete ? '<span class="badge done">終了</span>' : L.done || L.inProgress ? '<span class="badge progress">進行中</span>' : '<span class="badge none">未開始</span>';
        return '<button class="league-card" data-act="open-league" data-league="' + L.no + '">' +
          '<div class="ln">リーグ ' + L.no + '</div>' +
          '<div class="meta">' + L.count + '名 ・ ' + L.done + '/' + L.total + '試合 ' + st + '</div>' +
          '<div class="bar"><i style="width:' + pct + '%"></i></div>' +
          '<ul class="lplayers">' + b.players.filter(function (p) { return p.league === L.no; }).map(function (p) {
            return '<li><span class="num">' + p.num + '</span><span class="lpn">' + esc(p.name) + (p.team ? '<span class="team">（' + esc(p.team) + '）</span>' : '') + '</span></li>';
          }).join('') + '</ul></button>';
      }).join('') + '</div>';
    } else {
      html += '<input class="search" id="search" type="search" placeholder="名前・所属・くじ番号で検索" value="' + esc(S.search) + '" autocomplete="off">' +
        '<div class="name-list" id="name-list">' + nameListHtml() + '</div>';
    }
    html += '<p class="small muted" style="text-align:center;margin-top:20px">最終更新 ' + esc(b.generatedAt || '') + ' <button class="btn ghost" data-act="reload-boot" style="min-height:auto;padding:2px 8px">🔄</button></p>';
    html += '</div>';
    app.innerHTML = html;
  }

  function nameListHtml() {
    var q = S.search.trim().toLowerCase();
    var list = S.boot.players.filter(function (p) {
      if (!q) return true;
      return (p.name + ' ' + (p.team || '') + ' ' + p.num).toLowerCase().indexOf(q) >= 0 || String(p.name).replace(/\s/g, '').toLowerCase().indexOf(q.replace(/\s/g, '')) >= 0;
    });
    if (!list.length) return '<div class="empty">該当する選手がいません</div>';
    var tourPhase = S.boot.hasTournament && S.phase !== 'league';
    return list.map(function (p) {
      if (tourPhase && p.tour) {
        return '<button class="name-item" data-act="open-tplayer" data-type="' + tourKey(p.tour) + '" data-num="' + p.num + '">' +
          '<span class="num">' + p.num + '</span><span class="nm">' + (p.withdrawn ? '<span class="wd">' + esc(withTeam(p.name, p.team)) + '</span> ' + '<span class="badge wdb">棄権</span>' : esc(withTeam(p.name, p.team))) + '</span>' +
          '<span class="lg">' + esc(p.tour) + 'T ›</span></button>';
      }
      return '<button class="name-item" data-act="open-player" data-league="' + p.league + '" data-num="' + p.num + '">' +
        '<span class="num">' + p.num + '</span><span class="nm">' + esc(withTeam(p.name, p.team)) + '</span>' +
        '<span class="lg">リーグ' + p.league + ' ›</span></button>';
    }).join('');
  }

  /* ----- league (match list) ----- */

  function playerName(L, num) {
    for (var i = 0; i < L.players.length; i++) if (L.players[i].num === num) return L.players[i].label || L.players[i].name;
    return '#' + num;
  }

  function matchCard(L, m, focus) {
    var mine = focus && (m.p1 === focus || m.p2 === focus);
    var st = statusClass(m.status);
    var hasScore = m.status !== STATUS.NONE;
    var w1 = m.status === STATUS.DONE && m.winner === m.p1;
    var w2 = m.status === STATUS.DONE && m.winner === m.p2;
    var actions = '';
    if (S.mode === 'player') {
      if (m.status === STATUS.DONE) actions = '<span class="btn" data-act="edit" data-id="' + esc(m.id) + '">✏️ 修正</span>';
      else if (m.status === STATUS.PROGRESS) actions = '<span class="btn accent" data-act="edit" data-id="' + esc(m.id) + '">続きを入力</span>';
      else actions = '<span class="btn accent" data-act="edit" data-id="' + esc(m.id) + '">結果を入力</span>';
    }
    return '<button class="match st-' + st + (mine ? ' mine' : '') + '" data-act="match" data-id="' + esc(m.id) + '">' +
      '<div class="m-head"><span>第' + m.no + '試合</span><span class="sp"></span><span class="badge ' + st + '">' + esc(m.status) + '</span></div>' +
      '<div class="m-body">' +
      '<div class="m-pl' + (w1 ? ' win' : '') + '"><span class="num">' + m.p1 + '</span>' + nameHtml(m, 1) + '</div>' +
      (hasScore ? '<div class="m-score">' + m.c1 + ' - ' + m.c2 + '</div>' : '<div class="m-score vs">VS</div>') +
      '<div class="m-pl r' + (w2 ? ' win' : '') + '">' + nameHtml(m, 2) + '<span class="num">' + m.p2 + '</span></div>' +
      '</div>' +
      (m.sets && m.sets.length ? '<div class="m-sets">' + esc(setsText(m.sets)) + '</div>' : '') +
      (actions ? '<div class="m-actions">' + actions + '</div>' : '') +
      '</button>';
  }

  function renderLeague(L) {
    var focus = S.params.focus || null;
    var only = !!(focus && S.params.only !== false);
    var pct = L.total ? Math.round((L.done / L.total) * 100) : 0;
    var html = topbar('リーグ ' + L.no + '　試合一覧', 'select') + '<div class="wrap">';
    html += '<div class="summary"><span class="small"><b>' + L.done + '</b> / ' + L.total + ' 試合終了</span><div class="bar"><i style="width:' + pct + '%"></i></div>' +
      '<button class="icon-btn" data-act="refresh" title="更新">🔄</button></div>';
    html += '<p class="small muted" style="margin:6px 0 0">' + L.bestOf + 'セットマッチ（' + L.need + 'セット先取）・試合の順番は自由です</p>';
    html += '<div class="players-row">' + L.players.map(function (p) {
      return '<button class="pchip' + (focus === p.num ? ' on' : '') + '" data-act="focus" data-num="' + p.num + '"><span class="num">' + p.num + '</span>' + esc(p.label || p.name) + '</button>';
    }).join('') + '</div>';
    if (focus) {
      html += '<div class="focus-banner"><span>' + esc(playerName(L, focus)) + ' さんの試合' + (only ? 'のみ表示中' : 'を強調表示中') + '</span>' +
        '<button data-act="toggle-only">' + (only ? '全試合を表示' : '自分の試合のみ') + '</button>' +
        '<button data-act="focus" data-num="' + focus + '">✕</button></div>';
    }

    var list = L.matches.filter(function (m) { return !only || m.p1 === focus || m.p2 === focus; });
    var active = list.filter(function (m) { return m.status === STATUS.PROGRESS; });
    var todo = list.filter(function (m) { return m.status === STATUS.NONE; });
    var done = list.filter(function (m) { return m.status === STATUS.DONE; });

    if (active.length) html += '<div class="section-title">試合中（途中経過）</div>' + active.map(function (m) { return matchCard(L, m, focus); }).join('');
    if (todo.length) html += '<div class="section-title">これからの試合</div>' + todo.map(function (m) { return matchCard(L, m, focus); }).join('');
    if (done.length) html += '<div class="section-title">終了した試合</div>' + done.map(function (m) { return matchCard(L, m, focus); }).join('');
    if (!list.length) html += '<div class="card empty" style="margin-top:16px">試合がありません</div>';

    html += '<button class="result-link" data-act="standings">📊 リーグ ' + L.no + ' の結果（順位表）を見る ›</button>';
    html += '</div>';
    app.innerHTML = html;
  }

  /* ----- standings ----- */

  function renderStandings(L) {
    var html = topbar('リーグ ' + L.no + '　結果', 'league', { league: L.no, focus: S.params.focus || null });
    html += '<div class="wrap">';
    html += '<div style="display:flex;align-items:center;gap:8px;margin-top:16px">' +
      (L.complete ? '<span class="final">全試合終了・順位確定</span>' : '<span class="provisional">暫定順位（' + L.done + '/' + L.total + '試合終了）</span>') +
      '<span style="flex:1"></span><button class="icon-btn" data-act="refresh" title="更新">🔄</button></div>';

    // 順位表
    html += '<div class="section-title">順位</div><div class="table-wrap"><table><thead><tr>' +
      '<th>順位</th><th class="name">選手</th><th>勝敗</th><th>勝率</th><th>セット</th><th>セット率</th><th>得失点</th><th>進出</th></tr></thead><tbody>';
    L.standings.forEach(function (s) {
      var adv = s.advance === 'upper';
      html += '<tr class="' + (adv ? 'adv' : '') + '">' +
        '<td class="rank rank-' + s.rank + '">' + s.rank + (s.tied ? '<span class="small muted">=</span>' : '') + '</td>' +
        '<td class="name"><span class="num" style="margin-right:6px">' + s.num + '</span>' + esc(s.label || s.name) + '</td>' +
        '<td>' + s.wins + '勝' + s.losses + '敗</td>' +
        '<td>' + fmtRate(s) + '</td>' +
        '<td>' + s.setsWon + '-' + s.setsLost + '</td>' +
        '<td>' + fmtRatio(s) + '</td>' +
        '<td>' + s.ptsWon + '-' + s.ptsLost + '</td>' +
        '<td>' + (adv ? '<span class="badge upper">上位T</span>' : '<span class="badge lower">下位T</span>') + '</td></tr>';
    });
    html += '</tbody></table></div>';
    html += '<p class="legend">順位の決め方: ①勝率 ②セット率（獲得セット÷失セット、失セット0は♾️）③獲得セット数 ④当該選手間の直接対決。上位' + L.advanceCount + '名が上位トーナメント（上位T）へ進出。</p>';

    // 星取表
    html += '<div class="section-title">対戦表（タップで詳細）</div><div class="table-wrap"><table class="cross"><thead><tr><th class="name">選手</th>';
    L.players.forEach(function (p) { html += '<th><span class="num">' + p.num + '</span></th>'; });
    html += '</tr></thead><tbody>';
    L.players.forEach(function (row) {
      html += '<tr><td class="name"><span class="num" style="margin-right:6px">' + row.num + '</span>' + esc(row.label || row.name) + '</td>';
      L.players.forEach(function (col) {
        if (row.num === col.num) { html += '<td class="cell self"></td>'; return; }
        var m = null;
        for (var i = 0; i < L.matches.length; i++) {
          var x = L.matches[i];
          if ((x.p1 === row.num && x.p2 === col.num) || (x.p1 === col.num && x.p2 === row.num)) { m = x; break; }
        }
        if (!m) { html += '<td class="cell"><span class="n">-</span></td>'; return; }
        var mine = m.p1 === row.num;
        var a = mine ? m.c1 : m.c2, b = mine ? m.c2 : m.c1;
        var inner;
        if (m.status === STATUS.DONE) {
          var won = m.winner === row.num;
          inner = '<span class="' + (won ? 'w' : 'l') + '"><span class="mark">' + (won ? '○' : '●') + '</span>' + a + '-' + b + '</span>';
        } else if (m.status === STATUS.PROGRESS) {
          inner = '<span class="p"><span class="mark">途中</span>' + a + '-' + b + '</span>';
        } else inner = '<span class="n">－</span>';
        html += '<td class="cell"><button data-act="match" data-id="' + esc(m.id) + '">' + inner + '</button></td>';
      });
      html += '</tr>';
    });
    html += '</tbody></table></div>';
    html += '<p class="legend">行の選手から見た獲得セット数（○勝ち ●負け）。セルをタップすると試合の詳細を表示します。</p>';
    html += '<button class="result-link" style="background:var(--card);color:var(--primary)" data-act="back" data-to="league" data-p="' + esc(JSON.stringify({ league: L.no, focus: S.params.focus || null })) + '">‹ 試合一覧に戻る</button>';
    html += '</div>';
    app.innerHTML = html;
  }

  /* ----- 試合の文脈（リーグ戦 / トーナメント共通の入力・詳細・保存） ----- */

  function leagueCtx(L) {
    return {
      kind: 'league',
      head: 'リーグ ' + L.no,
      title: function (m) { return '第' + m.no + '試合'; },
      back: { view: 'league', params: { league: L.no, focus: S.params.focus || null } },
      entryParams: function (m) { return { kind: 'league', league: L.no, id: m.id, focus: S.params.focus || null }; },
      api: 'apiSaveMatch',
      apply: function (res) { S.leagues[L.no] = decorate(res.league); },
      reload: function () { return loadLeague(L.no); },
    };
  }

  function tourKey(type) { return type === '下位' ? 'lower' : 'upper'; }

  function tourCtx(m) {
    var key = tourKey(m.type);
    return {
      kind: 'tour',
      head: m.type + 'トーナメント ' + m.roundName,
      title: function (x) { return x.type + 'T ' + x.roundName; },
      back: { view: 'bracket', params: { type: key, focus: S.params.focus || null } },
      entryParams: function (x) { return { kind: 'tour', type: key, id: x.id, focus: S.params.focus || null }; },
      api: 'apiSaveTMatch',
      apply: function (res) { S.tour = decorateTour(res.tour); },
      reload: function () { return loadTour(); },
    };
  }

  /** 入力画面で扱っている試合 */
  function currentEntry() {
    if (S.params.kind === 'tour') {
      var tm = S.tour && S.tour.byId[S.params.id];
      return tm ? { ctx: tourCtx(tm), m: tm } : null;
    }
    var L = S.leagues[S.params.league];
    var m = L && findMatch(L, S.params.id);
    return m ? { ctx: leagueCtx(L), m: m } : null;
  }

  function playable(m) {
    return !!(m.p1 && m.p2) && m.status !== '不戦勝' && m.status !== '待機' && !m.wo;
  }

  function tableText(m) {
    if (m.status === '不戦勝') return '不戦勝';
    if (m.wo) return '不戦勝（棄権）';
    if (m.status === '待機') return '対戦相手待ち';
    if (m.status === STATUS.DONE) return m.table ? '台' + m.table + 'で実施' : '';
    if (m.isFinal) return m.status === STATUS.PROGRESS ? '決勝 試合中' : '決勝（個別に案内）';
    if (m.table) return m.status === STATUS.PROGRESS ? '台' + m.table + 'で試合中' : '台' + m.table + 'で試合';
    return '台の空き待ち';
  }

  /* ----- match detail (modal) ----- */

  function showDetail(ctx, m) {
    var w1 = m.status === STATUS.DONE && m.winner === m.p1;
    var w2 = m.status === STATUS.DONE && m.winner === m.p2;
    var pl = function (side) {
      var num = side === 1 ? m.p1 : m.p2;
      if (!num) return '<span class="muted">未定</span>';
      return ((side === 1 ? w1 : w2) ? '🏆 ' : '') + '<span class="num">' + num + '</span><br>' + nameHtml(m, side);
    };
    var html = '<div class="small muted" style="text-align:center">' + esc(ctx.head) + ' ・ ' + m.bestOf + 'セットマッチ ・ <span class="badge ' + statusClass(m.status) + '">' + esc(m.status) + '</span>' +
      (ctx.kind === 'tour' && tableText(m) ? ' ・ <b class="table-tag">' + esc(tableText(m)) + '</b>' : '') + '</div>' +
      '<div class="detail-score"><div class="pn">' + pl(1) + '</div>' +
      '<div class="sc">' + (m.wo ? '<span style="font-size:18px">不戦勝</span>' : m.status === STATUS.DONE || m.status === STATUS.PROGRESS ? m.c1 + ' - ' + m.c2 : '<span class="muted" style="font-size:18px">VS</span>') + '</div>' +
      '<div class="pn">' + pl(2) + '</div></div>';
    if (m.sets && m.sets.length) {
      html += '<div class="table-wrap" style="box-shadow:none;border:1px solid var(--line)"><table class="detail-sets"><thead><tr><th>セット</th><th>' + esc(m.n1) + '</th><th>' + esc(m.n2) + '</th></tr></thead><tbody>' +
        m.sets.map(function (s, i) {
          return '<tr><td class="muted">第' + (i + 1) + 'セット</td><td class="' + (s[0] > s[1] ? 'w' : '') + '">' + s[0] + '</td><td class="' + (s[1] > s[0] ? 'w' : '') + '">' + s[1] + '</td></tr>';
        }).join('') + '</tbody></table></div>';
    } else if (m.status === STATUS.NONE) {
      html += '<p class="muted" style="text-align:center">まだ試合は行われていません。</p>';
    } else if (m.status === '待機') {
      html += '<p class="muted" style="text-align:center">前の試合の勝者が決まると対戦相手が決まります。</p>';
    }
    if (m.wo) html += '<div class="notice warn">' + esc(m.wo === m.p1 ? m.n1 : m.n2) + ' さんの棄権により、' + esc(m.wo === m.p1 ? m.n2 : m.n1) + ' さんの不戦勝です。</div>';
    if (m.updated) html += '<p class="small muted" style="text-align:right;margin:8px 0 0">最終更新 ' + esc(m.updated) + '</p>';

    var buttons = [{ label: '閉じる', value: null, cls: 'ghost' }];
    if (S.mode === 'player' && playable(m)) {
      buttons.push({ label: m.status === STATUS.NONE ? '結果を入力する' : m.status === STATUS.PROGRESS ? '続きを入力する' : '✏️ 修正する', value: 'edit', cls: 'accent' });
    }
    modal({ title: ctx.title(m), icon: '🏓', html: html, buttons: buttons }).then(function (v) {
      if (v === 'edit') openEntry(ctx, m);
    });
  }

  /* ----- entry ----- */

  function openEntry(ctx, m, replace) {
    var sets = [];
    for (var i = 0; i < MAX_SETS; i++) {
      var s = m.sets && m.sets[i];
      sets.push(s ? [String(s[0]), String(s[1])] : ['', '']);
    }
    S.entry = { id: m.id, ver: m.ver, sets: sets, wasStatus: m.status, progress: m.status === STATUS.DONE ? 'done' : m.status === STATUS.PROGRESS ? 'playing' : 'before', autoDone: false, bestOf: m.bestOf };
    go('entry', ctx.entryParams(m), replace);
  }

  function renderEntry(ctx, m) {
    if (!m || S.mode !== 'player' || !playable(m)) { go(ctx.back.view, ctx.back.params, true); return; }
    if (!S.entry || S.entry.id !== m.id) {
      openEntry(ctx, m, true);
      return;
    }
    var E = S.entry;
    var bo = E.bestOf || m.bestOf;
    var n = need(bo);
    var backP = esc(JSON.stringify(ctx.back.params));
    var html = topbar(ctx.title(m) + '　結果入力', ctx.back.view, ctx.back.params) + '<div class="wrap">';
    html += '<div class="entry-head"><div class="small muted">' + esc(ctx.head) + ' ・ ' + bo + 'セットマッチ（' + n + 'セット先取）</div>' +
      (ctx.kind === 'tour' && m.table ? '<div class="table-big">台 ' + m.table + '</div>' : '') +
      '<div class="vs"><div><span class="num">' + m.p1 + '</span><br>' + nameHtml(m, 1) + '</div><div class="x">VS</div><div><span class="num">' + m.p2 + '</span><br>' + nameHtml(m, 2) + '</div></div></div>';
    if (E.wasStatus === STATUS.DONE) html += '<div class="notice warn">⚠️ 終了済みの試合の結果を修正しています。' + (ctx.kind === 'tour' ? '勝者を変える場合、次の試合がまだ始まっていなければ自動で差し替わります。' : '') + '</div>';
    if (E.wasStatus === STATUS.PROGRESS) html += '<div class="notice info">' + (m.sets && m.sets.length || ctx.kind !== 'tour' ? '途中経過が保存されています。続きを入力してください。' : '試合中です。試合が終わったら全セットの得点を入力して保存してください。') + '</div>';

    if (ctx.kind === 'tour') { // 試合ごとのセット数（当日の変更用）
      html += '<div class="section-title">この試合のセット数</div><div class="card"><div class="prog bo">' +
        [1, 3, 5, 7].map(function (k) {
          return '<button class="' + (bo === k ? 'on playing' : '') + '" data-act="bestof" data-v="' + k + '">' + k + 'セット<small>' + need(k) + 'セット先取</small></button>';
        }).join('') + '</div>' +
        (bo !== m.bestOf ? '<div class="small" style="margin-top:8px;color:var(--warn)"><b>' + m.bestOf + 'セット → ' + bo + 'セット に変更します（保存すると反映）</b></div>'
          : '<div class="small muted" style="margin-top:8px">当日にセット数を変える場合に選んでください（この試合だけ変わります）。</div>') + '</div>';
    }
    if (ctx.kind === 'tour') { // 進捗の選択はトーナメントのみ（リーグ戦は得点から自動判定）
      html += '<div class="section-title">進捗</div><div class="card"><div class="prog" id="prog">' + progHtml() + '</div>' +
        '<div class="small muted" style="margin-top:8px">試合を始めたら「試合中」を選んで保存してください（得点は後から入力できます）。得点を入力すると自動で切り替わります。</div></div>';
    }

    html += '<div class="section-title">各セットの得点</div><div class="card">' +
      '<div class="set-head"><span></span><span>' + nameHtml(m, 1) + '</span><span></span><span>' + nameHtml(m, 2) + '</span><span></span></div>';
    for (var i = 0; i < bo; i++) {
      html += '<div class="set-row" data-row="' + i + '"><label>第' + (i + 1) + 'セット</label>' +
        '<input type="text" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="off" data-set="' + i + '" data-side="0" value="' + esc(E.sets[i][0]) + '" aria-label="第' + (i + 1) + 'セット ' + esc(m.n1) + '">' +
        '<span class="dash">-</span>' +
        '<input type="text" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="off" data-set="' + i + '" data-side="1" value="' + esc(E.sets[i][1]) + '" aria-label="第' + (i + 1) + 'セット ' + esc(m.n2) + '">' +
        '<span class="mk"></span></div>';
    }
    html += '<div class="calc" id="calc"></div></div>';
    html += '<p class="small muted">試合の途中でも保存できます（途中経過として記録されます）。</p>';
    html += '<div class="entry-actions"><button class="btn" data-act="back" data-to="' + ctx.back.view + '" data-p="' + backP + '">キャンセル</button>' +
      '<button class="btn accent" data-act="save">💾 保存</button></div>';
    if (E.wasStatus !== STATUS.NONE) html += '<button class="reset-link" data-act="reset">' + (ctx.kind === 'tour' ? '得点を消して「試合前」に戻す' : 'この試合の結果を消して「未実施」に戻す') + '</button>';
    html += '</div>';
    app.innerHTML = html;
    updateCalc(m);
  }

  var PROG = [['before', '試合前'], ['playing', '試合中'], ['done', '試合終了']];

  function progHtml() {
    return PROG.map(function (x) {
      return '<button class="' + (S.entry.progress === x[0] ? 'on ' + x[0] : '') + '" data-act="prog" data-v="' + x[0] + '">' + x[1] + '</button>';
    }).join('');
  }

  /** 得点の入力に合わせて進捗を自動で切り替える（手で選んだ「試合終了」は戻さない） */
  function autoProgress(m) {
    if (!document.getElementById('prog')) return; // リーグ戦（進捗の選択なし）
    var E = S.entry, r = analyzeEntry(m), before = E.progress;
    if (r.winner) { if (E.progress !== 'done') { E.progress = 'done'; E.autoDone = true; } }
    else if (r.sets.length && E.progress === 'before') E.progress = 'playing';
    else if (E.progress === 'done' && E.autoDone) { E.progress = r.sets.length ? 'playing' : 'before'; E.autoDone = false; }
    if (before !== E.progress) { var el = document.getElementById('prog'); if (el) el.innerHTML = progHtml(); }
  }

  /** 入力中の各セットを解析する */
  function analyzeEntry(m) {
    var E = S.entry;
    var bo = (E && E.bestOf) || m.bestOf;
    var n = need(bo);
    var errors = [];
    var warnings = [];
    var sets = [];
    var a = 0, b = 0;
    var gap = false;
    for (var i = 0; i < bo; i++) {
      var x = String(E.sets[i][0]).trim(), y = String(E.sets[i][1]).trim();
      if (x === '' && y === '') { gap = true; continue; }
      if (x === '' || y === '') { errors.push('第' + (i + 1) + 'セット: 両方の選手の得点を入力してください'); continue; }
      var xi = Number(x), yi = Number(y);
      if (!Number.isInteger(xi) || !Number.isInteger(yi) || xi < 0 || yi < 0 || xi > 99 || yi > 99) { errors.push('第' + (i + 1) + 'セット: 得点は0〜99の数字で入力してください'); continue; }
      if (gap) { errors.push('第' + (i + 1) + 'セット: 前のセットが空欄です。第1セットから順に入力してください'); continue; }
      if (a >= n || b >= n) { errors.push('第' + (i + 1) + 'セット: すでに勝敗が決まっています（' + n + 'セット先取）。このセットは不要です'); continue; }
      if (xi === yi) { errors.push('第' + (i + 1) + 'セット: 同点（' + xi + '-' + yi + '）になっています'); continue; }
      if (!validGame(xi, yi)) warnings.push('第' + (i + 1) + 'セット（' + xi + '-' + yi + '）: 11点先取・10-10以降は2点差のルールに合いません');
      if (xi > yi) a++; else b++;
      sets.push([xi, yi]);
    }
    return { sets: sets, a: a, b: b, n: n, errors: errors, warnings: warnings, winner: a >= n ? 1 : b >= n ? 2 : 0 };
  }

  function updateCalc(m) {
    var r = analyzeEntry(m);
    var rows = app.querySelectorAll('.set-row');
    for (var i = 0; i < rows.length; i++) {
      var inputs = rows[i].querySelectorAll('input');
      var x = Number(inputs[0].value), y = Number(inputs[1].value);
      var filled = inputs[0].value !== '' && inputs[1].value !== '';
      inputs[0].classList.toggle('won', filled && x > y);
      inputs[1].classList.toggle('won', filled && y > x);
      rows[i].querySelector('.mk').textContent = filled && x !== y && !validGame(x, y) ? '⚠️' : '';
    }
    var calc = document.getElementById('calc');
    if (!calc) return;
    var state = r.winner ? '<span class="badge done">' + esc(r.winner === 1 ? m.n1 : m.n2) + ' の勝ち</span>'
      : r.sets.length ? '<span class="badge progress">試合途中</span>' : '';
    calc.className = 'calc';
    calc.innerHTML = '獲得セット数（自動計算）: <b style="font-size:20px">' + r.a + ' - ' + r.b + '</b> ' + state;
  }

  function saveEntry(ctx, m) {
    var E = S.entry;
    var r = analyzeEntry(m);
    var prog = E.progress;
    var score = '<b>' + r.a + ' - ' + r.b + '</b>';

    if (r.errors.length) {
      return alertBox('入力内容を確認してください', '<ul>' + r.errors.map(function (e) { return '<li>' + esc(e) + '</li>'; }).join('') + '</ul>');
    }
    // リーグ戦: 進捗は選ばず、入力された得点から自動で判定する（途中なら「試合途中ですね？」と確認）
    var askMidway = false;
    if (ctx.kind !== 'tour') {
      if (!r.sets.length) {
        if (E.wasStatus !== STATUS.NONE) return doReset(ctx, m);
        return alertBox('結果が入力されていません', '<p>各セットの得点を入力してください。</p>');
      }
      prog = r.winner ? 'done' : 'playing';
      askMidway = !r.winner;
    }
    if (prog === 'before') {
      if (r.sets.length) return alertBox('「試合前」を選んでいます', '<p>得点が入力されています。試合が始まっている場合は「試合中」または「試合終了」を選んでください。試合前に戻す場合は、得点を消してから保存してください。</p>');
      if (E.wasStatus === STATUS.NONE && E.bestOf !== m.bestOf) return submit(ctx, m, { matchId: m.id, ver: E.ver, sets: [], progress: 'before', bestOf: E.bestOf });
      if (E.wasStatus === STATUS.NONE) return alertBox('変更はありません', '<p>この試合はまだ「試合前」です。試合を始めたら「試合中」を選んで保存してください。</p>', 'ℹ️');
      return doReset(ctx, m);
    }
    if (prog === 'done') {
      if (!r.sets.length) return alertBox('結果が入力されていません', '<p>「試合終了」にするには、<b>全セットの得点</b>を入力してください。</p>');
      if (!r.winner) return alertBox('まだ勝敗が決まっていません', '<p>現在 ' + score + ' です（' + r.n + 'セット先取）。</p><p>試合が終わっている場合は、<b>全セットの得点</b>を入力してください。まだ試合中の場合は「試合中」を選んでください。</p>');
    }
    if (prog === 'playing' && r.winner) {
      return alertBox('勝敗が決まっています', '<p>' + score + ' で <b>' + esc(r.winner === 1 ? m.n1 : m.n2) + '</b> さんの勝ちになっています。</p><p>試合が終わっている場合は「試合終了」を選んでください。得点が違う場合は修正してください。</p>');
    }

    var chain = Promise.resolve(true);
    if (r.warnings.length) {
      chain = chain.then(function () {
        return modal({
          title: '得点を確認してください', icon: '⚠️',
          html: '<p>卓球のルール上ありえない得点があります。入力ミスではありませんか？</p><ul>' + r.warnings.map(function (w) { return '<li>' + esc(w) + '</li>'; }).join('') + '</ul>',
          buttons: [{ label: 'このまま続ける', value: true, cls: 'ghost' }, { label: '入力に戻る', value: false, cls: 'primary' }],
        });
      });
    }
    chain.then(function (ok) {
      if (!ok) return false;
      if (prog === 'playing' && askMidway) {
        return modal({
          title: '試合途中ですね？', icon: '⏸️',
          html: '<p>まだどちらの選手も <b>' + r.n + 'セット</b> を取っていません（現在 ' + score + '）。</p>' +
            '<p><b>試合途中</b>の場合は「途中経過として保存」を押してください。</p>' +
            '<p class="notice warn" style="margin:0"><b>試合が終わっている場合</b>は「入力に戻る」を押して、<b>全セットの得点</b>を入力してください。</p>',
          buttons: [{ label: '入力に戻る', value: false, cls: 'ghost' }, { label: '途中経過として保存', value: true, cls: 'accent' }],
          dismissable: false,
        });
      }
      if (prog === 'playing') return true; // トーナメントの「試合中」はそのまま保存
      var wn = r.winner === 1 ? m.n1 : m.n2;
      return modal({
        title: '試合結果を保存します', icon: '🏆',
        html: '<div class="detail-score"><div class="pn">' + nameHtml(m, 1) + '</div><div class="sc">' + r.a + ' - ' + r.b + '</div><div class="pn">' + nameHtml(m, 2) + '</div></div>' +
          '<p style="text-align:center"><b>' + esc(wn) + '</b> さんの勝ち</p><p class="small muted" style="text-align:center">' + esc(setsText(r.sets)) + '</p>' +
          (ctx.kind === 'tour' ? '<p class="small muted" style="text-align:center">勝者は次の試合に進み、空いた台には次の試合が自動で入ります。</p>' : ''),
        buttons: [{ label: '戻る', value: false, cls: 'ghost' }, { label: '保存する', value: true, cls: 'accent' }],
      });
    }).then(function (ok) {
      if (!ok) return;
      var pl = { matchId: m.id, ver: E.ver, sets: r.sets, progress: prog };
      if (ctx.kind === 'tour') pl.bestOf = E.bestOf;
      submit(ctx, m, pl);
    });
  }

  function doReset(ctx, m) {
    modal({
      title: '結果を消しますか？', icon: '🗑️',
      html: '<p>' + esc(ctx.title(m)) + '（' + esc(m.n1) + ' vs ' + esc(m.n2) + '）' + (ctx.kind === 'tour' ? 'を「試合前」に戻します。入力済みの得点は消えます。' : 'の結果を消して「未実施」に戻します。') + '</p>',
      buttons: [{ label: 'やめる', value: false, cls: 'ghost' }, { label: '結果を消す', value: true, cls: 'danger' }],
    }).then(function (ok) {
      if (ok) submit(ctx, m, ctx.kind === 'tour' ? { matchId: m.id, ver: S.entry.ver, reset: true, progress: 'before', bestOf: S.entry.bestOf } : { matchId: m.id, ver: S.entry.ver, reset: true, progress: 'before' });
    });
  }

  function submit(ctx, m, payload, force) {
    payload.code = S.entryCode;
    payload.meta = clientMeta();
    payload.force = !!force;
    busy(true);
    call(ctx.api, S.tid, payload).then(function (res) {
      busy(false);
      if (res.conflict) {
        var c = res.current;
        return modal({
          title: '他の人が先に更新しました', icon: '🔄',
          html: '<p>この試合は、あなたが画面を開いた後に別の人が結果を更新しています。</p>' +
            '<p>現在の記録: <b>' + esc(c.status) + '</b>' + (c.status === STATUS.DONE || c.status === STATUS.PROGRESS ? '（' + c.c1 + ' - ' + c.c2 + '）<br><span class="small muted">' + esc(setsText(c.sets)) + '</span>' : '') + '</p>' +
            '<p>あなたの入力内容で上書きしますか？</p>',
          buttons: [{ label: '上書きせず最新を見る', value: 'reload', cls: 'ghost' }, { label: '上書きする', value: 'force', cls: 'danger' }],
          dismissable: false,
        }).then(function (v) {
          if (v === 'force') return submit(ctx, m, payload, true);
          S.entry = null;
          return ctx.reload().then(function () { go(ctx.back.view, ctx.back.params, true); });
        });
      }
      ctx.apply(res);
      S.entry = null;
      if (S.boot) loadBoot(true).catch(function () {});
      toast(payload.bestOf && payload.bestOf !== m.bestOf && payload.progress === 'before' && !(payload.sets && payload.sets.length) && !payload.reset ? 'セット数を ' + payload.bestOf + 'セットに変更しました' : payload.reset ? (ctx.kind === 'tour' ? '試合前に戻しました' : '結果を消しました') : payload.progress === 'playing' ? (ctx.kind === 'tour' ? '「試合中」として保存しました' : '途中経過を保存しました') : '保存しました');
      go(ctx.back.view, ctx.back.params, true);
    }).catch(function (e) {
      busy(false);
      showError(e);
    });
  }

  /* ----- tournament (bracket) ----- */

  function decorateTour(T) {
    if (!T || T._decorated) return T;
    T.byId = {};
    ['upper', 'lower'].forEach(function (k) {
      var b = T[k];
      if (!b) return;
      b.matches.forEach(function (m) {
        m.r1 = m.n1; m.t1 = m.team1 || ''; m.r2 = m.n2; m.t2 = m.team2 || '';
        m.n1 = m.p1 ? withTeam(m.r1, m.t1) : '';
        m.n2 = m.p2 ? withTeam(m.r2, m.t2) : '';
        T.byId[m.id] = m;
      });
    });
    T._decorated = true;
    return T;
  }

  function loadTour(silent) {
    if (!silent) busy(true);
    return call('apiGetBracket', S.tid).then(function (T) {
      S.tour = decorateTour(T);
      busy(false);
      return S.tour;
    }).catch(function (e) { busy(false); throw e; });
  }

  function withTour(fn) {
    if (S.tour) return fn(S.tour);
    app.innerHTML = topbar('トーナメント', 'select') + '<div class="loading"><div class="spinner"></div>読み込み中…</div>';
    loadTour(true).then(function () { render(); }).catch(showError);
  }

  /** 選手番号 → 「名前（所属）」（トーナメント内から探す） */
  function tName(b, num) {
    if (!b || !num) return '';
    for (var i = 0; i < b.matches.length; i++) {
      var m = b.matches[i];
      if (m.p1 === num) return m.n1;
      if (m.p2 === num) return m.n2;
    }
    return '#' + num;
  }

  function champName(b) {
    return b && b.champion ? tName(b, b.champion) : '';
  }

  /** 優勝・準優勝・3位 */
  function podiumHtml(b) {
    if (!b.champion && !b.thirdPlace) return '';
    var rows = [];
    if (b.champion) rows.push('🥇 優勝: <b>' + esc(tName(b, b.champion)) + '</b>');
    if (b.runnerUp) rows.push('🥈 準優勝: <b>' + esc(tName(b, b.runnerUp)) + '</b>');
    if (b.thirdPlace) rows.push('🥉 3位: <b>' + esc(tName(b, b.thirdPlace)) + '</b>');
    return '<div class="champ-banner">' + esc(b.type) + 'トーナメント<br>' + rows.join('<br>') + '</div>';
  }

  /** 台の状況と次の試合 */
  function boardHtml(T) {
    var html = '';
    if (T.finals && T.finals.length) {
      html += '<div class="section-title">決勝（台と開始時間は大会スタッフが個別に案内します）</div><div class="queue">' +
        T.finals.map(function (id) {
          var m = T.byId[id];
          return '<button class="qitem final-item" data-act="tmatch" data-id="' + esc(id) + '"><span class="qno">🏆</span>' +
            '<span class="badge ' + (m.type === '上位' ? 'upper' : 'lower') + '">' + m.type + '</span><span class="small muted">決勝' + (m.status === STATUS.PROGRESS ? ' ・ 試合中 ' + m.c1 + '-' + m.c2 : ' ・ 案内待ち') + '</span>' +
            '<span class="qnames">' + esc(m.n1) + ' <span class="muted">vs</span> ' + esc(m.n2) + '</span></button>';
        }).join('') + '</div>';
    }
    var called = [], playing = [], empty = [];
    T.board.forEach(function (b) {
      var m = b.id && T.byId[b.id];
      if (!m) empty.push(b);
      else if (m.status === STATUS.PROGRESS) playing.push(b);
      else called.push(b);
    });
    // 一括選択: 呼び出し中でなくなった試合は選択から外す
    var calledIds = called.map(function (b) { return b.id; });
    Object.keys(S.tsel).forEach(function (id) { if (calledIds.indexOf(id) < 0) delete S.tsel[id]; });
    var canBulk = S.mode === 'player' && called.length > 0;
    var card = function (b, kind) {
      var m = T.byId[b.id];
      var sel = kind === 'called' && S.tsel[m.id];
      return '<div class="tbl ' + kind + (b.extra ? ' extra' : '') + (sel ? ' selected' : '') + '" role="button" tabindex="0" data-act="tmatch" data-id="' + esc(m.id) + '">' +
        '<div class="tno">' + (kind === 'called' && canBulk ? '<span class="tchk' + (sel ? ' on' : '') + '" data-act="tsel" data-id="' + esc(m.id) + '" role="checkbox" aria-checked="' + (sel ? 'true' : 'false') + '" aria-label="台' + b.table + 'を選択">' + (sel ? '✓' : '') + '</span>' : '') +
        '台' + b.table + ' <span class="badge ' + (m.type === '上位' ? 'upper' : 'lower') + '">' + m.type + '</span>' +
        (kind === 'called' ? '<span class="callmark">' + (canBulk ? '呼出中' : '呼び出し中') + '</span>' : '<span class="playmark">試合中</span>') + '</div>' +
        '<div class="small muted">' + esc(m.roundName) + (kind === 'playing' ? ' ・ ' + m.c1 + '-' + m.c2 : '') + ' ・ ' + m.bestOf + 'セット</div>' +
        '<div class="tpl">' + nameHtml(m, 1) + '</div><div class="tpl">' + nameHtml(m, 2) + '</div>' +
        (kind === 'called' && S.mode === 'player' ? '<div class="small callhint">タップして試合開始・結果入力</div>' : '') + '</div>';
    };
    html += '<div class="section-title">📣 呼び出し中（新しく割り当てた台・選手は台へ移動してください）</div>';
    if (canBulk) {
      var nSel = Object.keys(S.tsel).length;
      var allOn = nSel === called.length;
      html += '<div class="bulkbar"><button class="btn ghost" data-act="tsel-all">' + (allOn ? '☑ 選択をすべて外す' : '☐ すべて選択') + '</button>' +
        '<button class="btn accent" data-act="tstart"' + (nSel ? '' : ' disabled') + '>▶ 選択した' + (nSel ? ' ' + nSel + ' ' : '') + '試合を「試合中」にする</button></div>' +
        '<div class="small muted" style="margin:0 4px 8px">試合が始まった台の □ にチェックを入れて、まとめて「試合中」に移せます。</div>';
    }
    html += called.length ? '<div class="board">' + called.map(function (b) { return card(b, 'called'); }).join('') + '</div>'
      : '<div class="small muted board-none">呼び出し中の台はありません</div>';
    html += '<div class="section-title">🏓 試合中</div>';
    html += playing.length ? '<div class="board">' + playing.map(function (b) { return card(b, 'playing'); }).join('') + '</div>'
      : '<div class="small muted board-none">試合中の台はありません</div>';
    if (empty.length) html += '<div class="small muted board-none">空いている台: ' + empty.map(function (b) { return '台' + b.table; }).join('、') + '</div>';
    if (T.queue.length) {
      html += '<div class="section-title">次の試合（目安：台が空くと、上位・下位の残り試合数に応じて順に呼び出し）</div><div class="queue">' +
        T.queue.slice(0, 8).map(function (id, i) {
          var m = T.byId[id];
          return '<button class="qitem" data-act="tmatch" data-id="' + esc(id) + '"><span class="qno">' + (i + 1) + '</span>' +
            '<span class="badge ' + (m.type === '上位' ? 'upper' : 'lower') + '">' + m.type + '</span><span class="small muted">' + esc(m.roundName) + '</span>' +
            '<span class="qnames">' + esc(m.n1) + ' <span class="muted">vs</span> ' + esc(m.n2) + '</span></button>';
        }).join('') + (T.queue.length > 8 ? '<div class="small muted" style="padding:6px 12px">ほか ' + (T.queue.length - 8) + ' 試合</div>' : '') + '</div>';
    }
    return html;
  }

  /** トーナメント表（SVG の線 + 絶対配置の試合ボックス） */
  function bracketHtml(b, focus) {
    var H = 62, GAP = 12, W = 228, G = 30, TOP = 26;
    var S1 = H + GAP;
    var R = b.rounds;
    var height = (b.size / 2) * S1 + TOP;
    var width = R * (W + G) + 170;
    var yOf = function (r, pos) { return TOP + (pos + 0.5) * S1 * Math.pow(2, r - 1); };
    var xOf = function (r) { return (r - 1) * (W + G); };
    var lines = '';
    var boxes = '';
    for (var r = 1; r <= R; r++) {
      boxes += '<div class="rlabel" style="left:' + xOf(r) + 'px;width:' + W + 'px">' + esc(b.roundNames[r - 1]) + '</div>';
    }
    var thirdY = yOf(R, 0) + H + 64;
    if (b.hasThird) height = Math.max(height, thirdY + 60);
    b.matches.forEach(function (m) {
      var x = xOf(m.round), y = m.third ? thirdY : yOf(m.round, m.pos);
      if (m.third) {
        boxes += '<div class="rlabel third" style="left:' + x + 'px;top:' + (y - H / 2 - 26) + 'px;width:' + W + 'px">3位決定戦</div>';
      } else if (m.round < R) {
        var y2 = yOf(m.round + 1, Math.floor(m.pos / 2));
        var xm = x + W + G / 2;
        lines += '<path d="M' + (x + W) + ' ' + y + ' H' + xm + ' V' + y2 + ' H' + (x + W + G) + '" class="' + (m.status === STATUS.DONE || m.status === '不戦勝' ? 'done' : '') + '"/>';
      } else {
        lines += '<path d="M' + (x + W) + ' ' + y + ' H' + (x + W + G) + '" class="' + (m.status === STATUS.DONE ? 'done' : '') + '"/>';
      }
      var mine = focus && (m.p1 === focus || m.p2 === focus);
      var row = function (side) {
        var num = side === 1 ? m.p1 : m.p2, seed = side === 1 ? m.s1 : m.s2, c = side === 1 ? m.c1 : m.c2;
        var won = (m.status === STATUS.DONE || m.status === '不戦勝') && m.winner && m.winner === num;
        var lost = m.status === STATUS.DONE && num && m.winner !== num;
        var name = num ? nameHtml(m, side) : (m.status === '不戦勝' ? '<span class="muted">（不戦勝）</span>' : '<span class="muted">未定</span>');
        return '<div class="brow' + (won ? ' won' : '') + (lost ? ' lost' : '') + (focus && num === focus ? ' me' : '') + '">' +
          '<span class="seed">' + (seed || '') + '</span><span class="bname">' + name + '</span>' +
          '<span class="bsc">' + (m.wo ? '' : m.status === STATUS.DONE || m.status === STATUS.PROGRESS ? c : '') + '</span></div>';
      };
      var tag = tableText(m);
      boxes += '<button class="bm st-' + statusClass(m.status) + (m.status === '不戦勝' ? ' bye' : '') + (m.table && (m.status === STATUS.NONE || m.status === STATUS.PROGRESS) ? ' ontable' : '') + (mine ? ' mine' : '') + '" style="left:' + x + 'px;top:' + (y - H / 2) + 'px;width:' + W + 'px;height:' + H + 'px" data-act="tmatch" data-id="' + esc(m.id) + '">' +
        row(1) + row(2) + (tag && m.status !== '不戦勝' ? '<span class="btag">' + esc(tag) + '</span>' : '') + '</button>';
    });
    var ch = champName(b);
    var lastX = xOf(R) + W + G;
    boxes += '<div class="champ" style="left:' + lastX + 'px;top:' + (yOf(R, 0) - 24) + 'px">' +
      (ch ? '<div class="small">🏆 優勝</div><b>' + esc(ch) + '</b>' : '<div class="small muted">🏆 優勝</div><span class="muted">未定</span>') + '</div>';
    if (b.hasThird) {
      var th = b.thirdPlace ? tName(b, b.thirdPlace) : '';
      boxes += '<div class="champ third" style="left:' + lastX + 'px;top:' + (thirdY - 24) + 'px">' +
        (th ? '<div class="small">🥉 3位</div><b>' + esc(th) + '</b>' : '<div class="small muted">🥉 3位</div><span class="muted">未定</span>') + '</div>';
    }
    return '<div class="bracket-wrap" id="bracket-wrap"><div class="bracket" style="width:' + width + 'px;height:' + height + 'px">' +
      '<svg class="blines" width="' + width + '" height="' + height + '">' + lines + '</svg>' + boxes + '</div></div>';
  }

  /** 選手の試合カード（トーナメント） */
  function tCard(m, focus) {
    var st = statusClass(m.status);
    var w1 = m.status === STATUS.DONE && m.winner === m.p1;
    var w2 = m.status === STATUS.DONE && m.winner === m.p2;
    var act = '';
    if (S.mode === 'player' && playable(m)) {
      act = m.status === STATUS.DONE ? '<span class="btn" data-act="tedit" data-id="' + esc(m.id) + '">✏️ 修正</span>'
        : '<span class="btn accent" data-act="tedit" data-id="' + esc(m.id) + '">' + (m.status === STATUS.PROGRESS ? '続きを入力' : '結果を入力') + '</span>';
    }
    var pl = function (side) {
      var num = side === 1 ? m.p1 : m.p2;
      if (!num) return '<span class="muted">未定</span>';
      return side === 1 ? '<span class="num">' + num + '</span>' + nameHtml(m, 1) : nameHtml(m, 2) + '<span class="num">' + num + '</span>';
    };
    return '<button class="match st-' + st + (focus && (m.p1 === focus || m.p2 === focus) ? ' mine' : '') + '" data-act="tmatch" data-id="' + esc(m.id) + '">' +
      '<div class="m-head"><span>' + esc(m.type + 'T ' + m.roundName) + '</span><span class="sp"></span>' +
      (tableText(m) ? '<b class="table-tag">' + esc(tableText(m)) + '</b>' : '') + '<span class="badge ' + st + '">' + esc(m.status) + '</span></div>' +
      '<div class="m-body"><div class="m-pl' + (w1 ? ' win' : '') + '">' + pl(1) + '</div>' +
      (m.wo ? '<div class="m-score vs">不戦勝</div>' : m.status === STATUS.DONE || m.status === STATUS.PROGRESS ? '<div class="m-score">' + m.c1 + ' - ' + m.c2 + '</div>' : '<div class="m-score vs">VS</div>') +
      '<div class="m-pl r' + (w2 ? ' win' : '') + '">' + pl(2) + '</div></div>' +
      (m.sets && m.sets.length ? '<div class="m-sets">' + esc(setsText(m.sets)) + '</div>' : '') +
      (act ? '<div class="m-actions">' + act + '</div>' : '') + '</button>';
  }

  function renderBracket(T) {
    if (!T.exists) {
      app.innerHTML = topbar('トーナメント', 'select') + '<div class="wrap"><div class="card empty" style="margin-top:16px">トーナメントはまだ作成されていません。</div></div>';
      return;
    }
    var key = S.params.type && T[S.params.type] ? S.params.type : T.upper ? 'upper' : 'lower';
    var b = T[key];
    var focus = S.params.focus || null;
    var html = topbar('トーナメント', 'select') + '<div class="wrap wide">';
    if (T.upper && T.lower) {
      html += '<div class="tabs"><button class="' + (key === 'upper' ? 'on' : '') + '" data-act="btab" data-type="upper">🥇 上位トーナメント</button>' +
        '<button class="' + (key === 'lower' ? 'on' : '') + '" data-act="btab" data-type="lower">下位トーナメント</button></div>';
    }
    html += '<div class="summary"><span class="small"><b>' + b.done + '</b> / ' + b.total + ' 試合終了 ・ ' + b.bestOf + 'セットマッチ（' + need(b.bestOf) + 'セット先取）</span>' +
      '<span style="flex:1"></span><button class="icon-btn" data-act="refresh" title="更新">🔄</button></div>';
    html += podiumHtml(b);

    if (focus) {
      var mine = b.matches.filter(function (m) { return (m.p1 === focus || m.p2 === focus) && m.status !== '不戦勝'; });
      var other = T[key === 'upper' ? 'lower' : 'upper'];
      var inOther = other && other.matches.some(function (m) { return m.p1 === focus || m.p2 === focus; });
      var fname = '';
      b.matches.concat(other ? other.matches : []).some(function (m) {
        if (m.p1 === focus) { fname = m.n1; return true; }
        if (m.p2 === focus) { fname = m.n2; return true; }
        return false;
      });
      html += '<div class="focus-banner"><span>' + esc(fname || ('#' + focus)) + ' さんの試合</span><button data-act="tfocus-clear">✕</button></div>';
      if (inOther && !mine.length) {
        html += '<div class="card" style="margin-top:12px">この選手は' + esc(other.type) + 'トーナメントです。<button class="btn" data-act="btab" data-type="' + (key === 'upper' ? 'lower' : 'upper') + '">' + esc(other.type) + 'トーナメントを見る</button></div>';
      } else if (mine.length) {
        html += '<div style="margin-top:12px">' + mine.map(function (m) { return tCard(m, focus); }).join('') + '</div>';
      }
    }

    html += boardHtml(T);
    html += '<div class="section-title">' + esc(b.type) + 'トーナメント表（' + b.players + '名）</div>' + bracketHtml(b, focus);
    html += '<p class="legend">数字は シード順位。試合をタップすると詳細' + (S.mode === 'player' ? '・結果入力' : '') + 'ができます。上位シードは1回戦が不戦勝になる場合があります。</p>';
    html += '</div>';
    app.innerHTML = html;
  }

  /** 選択画面（トーナメント） */
  function renderSelectTour(b) {
    var t = b.tour;
    var card = function (key, label) {
      var x = t[key];
      if (!x) return '';
      var pct = x.total ? Math.round((x.done / x.total) * 100) : 0;
      var champ = '';
      if (x.champion) {
        var p = b.players.filter(function (q) { return q.num === x.champion; })[0];
        champ = '<div class="small" style="margin-top:6px">🏆 優勝: <b>' + esc(p ? withTeam(p.name, p.team) : '#' + x.champion) + '</b></div>';
      }
      return '<button class="league-card tour-card" data-act="open-bracket" data-type="' + key + '">' +
        '<div class="ln">' + label + '</div><div class="meta">' + x.players + '名 ・ ' + x.done + '/' + x.total + '試合 ・ ' + x.bestOf + 'セットマッチ</div>' +
        '<div class="bar"><i style="width:' + pct + '%"></i></div>' + champ + '</button>';
    };
    var html = '<div class="league-grid tour-grid">' + card('upper', '🥇 上位トーナメント') + card('lower', '下位トーナメント') + '</div>';

      '<input class="search" id="search" type="search" placeholder="名前・所属・くじ番号で検索" value="' + esc(S.search) + '" autocomplete="off">' +
      '<div class="name-list" id="name-list">' + nameListHtml() + '</div>';

      S.adminPw = '';
      S.entry = null;
      S.search = '';

  /* ----- system admin (create / manage tournaments) ----- */

  function sysLogin() {
    var first = !S.masterSet;
    modal({
      title: first ? 'システム管理者パスワードの設定' : 'システム管理者ログイン', icon: '🔒',
      html: (first ? '<p class="small muted">初回のみ、大会を作成・管理するためのパスワードを決めてください（4文字以上）。忘れないようにしてください。</p>' : '') +
        '<input id="spw" class="search" type="password" placeholder="システム管理者パスワード" autocomplete="' + (first ? 'new-password' : 'current-password') + '">' +
        (first ? '<input id="spw2" class="search" style="margin-top:8px" type="password" placeholder="もう一度入力" autocomplete="new-password">' : ''),
      buttons: [{ label: 'キャンセル', value: false, cls: 'ghost' }, { label: first ? '設定する' : 'ログイン', value: true, cls: 'primary' }],
      onOpen: function (bg) { setTimeout(function () { bg.querySelector('#spw').focus(); }, 50); },
      beforeClose: function (v, bg) {
        if (!v) return;

      },
    }).then(function (ok) {
      if (!ok) return;
      busy(true);
      call(first ? 'sysSetup' : 'sysGetData', S._spw).then(function (d) {
        busy(false);
        S.sysPw = S._spw;
        S.masterSet = true;
        S.sys = d;
        S.mode = 'sys';
        go('sys', {});
      }).catch(function (e) { busy(false); showError(e); });
    });
  }

  function sysCall(fn) {
    var args = Array.prototype.slice.call(arguments, 1);
    busy(true);
    return call.apply(null, [fn, S.sysPw].concat(args)).then(function (r) { busy(false); S.sys = r; return r; })
      .catch(function (e) { busy(false); showError(e); throw e; });
  }

    html += '<div class="section-title">公開URL（独自ドメイン）</div><div class="card" id="pub-form">' +
      '<div class="form-row"><label>公開URL</label><input name="publicUrl" placeholder="https://portal.example.com/" value="' + esc(D.publicUrl || '') + '" autocomplete="off" inputmode="url">' +

      '<div class="form-row"><label>送信中継の連携キー</label><input name="relaySecret" value="' + esc(MC.relaySecret || '') + '" autocomplete="off" spellcheck="false">' +
      '<div class="hint">送信中継のスクリプト プロパティ <b>MAIL_RELAY_SECRET</b> と同じ値（16文字以上）。</div></div>' +

    html += '<div class="section-title">その他</div><div class="card"><button class="btn ghost" data-act="sys-pw">システム管理者パスワードを変更</button></div>';

  function sysFind(tid) {
    return (S.sys.tournaments || []).filter(function (t) { return t.id === tid; })[0];
  }

  function sysAction(act, el) {
    var tid = el.getAttribute('data-tid');
    var t = tid ? sysFind(tid) : null;
    if (act === 'sys-create') {
      var f = {};
      document.querySelectorAll('#sys-form [name]').forEach(function (x) { f[x.name] = x.value.trim(); });
      if (!f.name || !f.adminPassword) return alertBox('入力してください', '<p>大会名と大会管理者パスワードは必須です。</p>');
      return sysCall('sysCreateTournament', f).then(function (d) {
        loadTournaments(true).catch(function () {});
        render();
        var c = sysFind(d.created);
        return modal({
          title: '大会を作成しました', icon: '✅',
          html: '<p><b>' + esc(f.name) + '</b> を作成しました。スプレッドシートの「参加者」シートに選手名を入力し、管理者メニューからリーグ戦を作成してください。</p>' +
            (c && c.link ? '<p class="small muted">この大会の直接リンク:<br><span style="word-break:break-all">' + esc(c.link) + '</span></p>' : ''),

        buttons: [{ label: 'やめる', value: false, cls: 'ghost' }, { label: '削除する', value: true, cls: 'danger' }],
      }).then(function (ok) {

        sysCall('sysRemoveTournament', tid).then(function () { render(); loadTournaments(true).catch(function () {}); }).catch(function () {});
      });

      return toast('連携キーを作成しました。保存して、送信中継の MAIL_RELAY_SECRET にも同じ値を設定してください');
    }
    if (act === 'sys-mail-save') {
      var mc = {};
      document.querySelectorAll('#mailcfg-form [name]').forEach(function (x) { mc[x.name] = x.value.trim(); });
      return sysCall('sysSetMailConfig', mc).then(function () { render(); toast('メール送信の設定を保存しました'); }).catch(function () {});
    }
    if (act === 'sys-mail-check') {
      busy(true);
      return call('sysTestMailRelay', S.sysPw).then(function (r) {
        busy(false);
        alertBox(r.fromOk ? '送信中継に接続できました' : '送信元が使えません',

          '<p>送信元 ' + esc(r.from || '（未設定）') + ': <b>' + (r.fromOk ? '使えます' : 'このアカウントの Gmail に「他のメールアドレス（送信元）」として登録されていません') + '</b></p>' +
          '<p class="small muted">今日あと送信できる数: ' + esc(r.remaining) + ' 通</p>', r.fromOk ? '✅' : '⚠️');
      }).catch(function (e) { busy(false); showError(e); });
    }
    if (act === 'sys-logkey-gen') {
      var chars = 'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnpqrstuvwxyz23456789', key = '';
      var rnd = new Uint32Array(32);
      try { crypto.getRandomValues(rnd); } catch (e) { for (var q = 0; q < 32; q++) rnd[q] = Math.floor(Math.random() * 4294967295); }
      for (var k = 0; k < 32; k++) key += chars.charAt(rnd[k] % chars.length);

    if (act === 'sys-logkey') {

    }
    if (act === 'sys-pub') {

    if (act === 'sys-pw') {
      return modal({

        html: '<input id="npw" class="search" type="password" placeholder="新しいパスワード（4文字以上）" autocomplete="new-password">',

      });
    }
  }

  /** システム管理者のまま、大会の管理者メニューに入る */
  function sysOpen(tid) {
    var t = sysFind(tid);
    if (!t) return;
    switchTournament({ id: t.id, name: t.name, date: t.date });
    busy(true);
    Promise.all([call('adminLogin', t.id, S.sysPw), loadBoot(true)]).then(function (r) {
      busy(false);
      S.adminPw = S.sysPw;
      S.admin = r[0];
      S.mode = 'admin';
      go('admin', {});
      showAutoAdded(r[0]);
    }).catch(function (e) { busy(false); showError(e); });
  }

  function copyText(text) {
    var done = function () { toast('リンクをコピーしました'); };
    var fallback = function () {
      modal({ title: 'リンク', icon: '🔗', html: '<input class="search" readonly value="' + esc(text) + '" onfocus="this.select()">', buttons: [{ label: '閉じる', value: true, cls: 'primary' }] });
    };
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, fallback);
      else fallback();
    } catch (e) { fallback(); }
  }

  function updatePreview() {
    var el = document.getElementById('adm-preview');
    if (!el || !S.admin) return;
    var f = adminForm();
    var N = S.admin.stats.eligible + S.admin.missingNumber.length;
    var L = f.leagueCount || 0;
    var per = f.playersPerLeague || 0;
    var rec = per ? Math.max(1, Math.round(N / per)) : 0;
    var html = '<div>対象選手: <b>' + N + '名</b> ／ 標準 ' + per + '名 → 推奨リーグ数 <b>' + rec + '</b>' +
      (rec && rec !== L ? ' <button class="btn" style="min-height:auto;padding:2px 10px;font-size:13px" data-act="adm-rec" data-v="' + rec + '">推奨値を使う</button>' : '') + '</div>';
    if (L >= 1 && N >= L * 2) {
      var base = Math.floor(N / L), extra = N % L, sizes = [];
      for (var i = 0; i < L; i++) sizes.push(base + (i < extra ? 1 : 0));
      var games = sizes.reduce(function (t, n) { return t + (n * (n - 1)) / 2; }, 0);
      html += '<div class="sizes">' + sizes.map(function (n, i) { return '<span>リーグ' + (i + 1) + ': ' + n + '名</span>'; }).join('') + '</div>' +
        '<div class="small muted" style="margin-top:6px">合計 ' + games + ' 試合' + (extra ? '（人数が割り切れないため一部のリーグが1名多くなります）' : '') + '</div>';
    } else if (L >= 1) {
      html += '<div class="notice warn">' + L + 'リーグには最低 ' + L * 2 + ' 名必要です。</div>';
    }
    el.innerHTML = html;
  }

  /* ----- メール送信（管理者） ----- */

  var MAIL_FILTERS = [
    ['all', '全員'], ['attend', '参加確認済み'], ['paid', '支払確認済み'], ['unpaid', '参加確認済み・未払い'],
    ['eligible', 'リーグ対象（参加・支払・くじ番号あり）'], ['notattend', '参加確認がまだの人'],
  ];

  function mailMatches(r, f, noWd) {
    if (noWd && r.withdrawn) return false;
    if (f === 'attend') return r.attend;
    if (f === 'paid') return r.paid;
    if (f === 'unpaid') return r.attend && !r.paid;
    if (f === 'eligible') return r.eligible;
    if (f === 'notattend') return !r.attend;
    return true;
  }

  /** 絞り込んだ宛先を、メールアドレスごとにまとめる */
  function mailGroups() {
    var M = S.mail, map = {}, list = [], invalid = [];
    M.info.recipients.forEach(function (r) {
      if (!mailMatches(r, M.filter, M.noWd)) return;
      if (!r.valid) { if (r.email) invalid.push(r); return; } // 空欄は「空欄」として別に数える
      var key = r.email.toLowerCase();
      if (!map[key]) { map[key] = { email: r.email, names: [], teams: [] }; list.push(map[key]); }
      map[key].names.push(r.name);
      if (r.team && map[key].teams.indexOf(r.team) < 0) map[key].teams.push(r.team);
    });
    return { list: list, invalid: invalid };
  }

    html += '<button class="result-link" data-act="mail-send"' + (sel.length ? '' : ' disabled style="opacity:.5"') + '>📧 選択した ' + sel.length + ' 件に送信する</button>';
    html += '</div>';

  }

  function mailPersonal(text, names) { return String(text || '').replace(/\{名前\}/g, names.join('・')); }

  /** 分けて送る（MAIL_BATCH_MAX = 25 件まで。少し余裕をもって 20 件ずつ） */
  function mailSendAll(groups, test) {
    var M = S.mail, results = [], i = 0, size = 20;
    var b = document.getElementById('busy');
    var orig = b.innerHTML;
    b.innerHTML = '<div style="text-align:center"><div class="spinner" style="margin:0 auto 10px"></div><div id="busy-text" style="font-weight:800"></div></div>';
    b.hidden = false;
    var step = function () {
      if (i >= groups.length) return Promise.resolve();
      var chunk = groups.slice(i, i + size);
      document.getElementById('busy-text').textContent = '送信中… ' + Math.min(i + chunk.length, groups.length) + ' / ' + groups.length;
      return call('adminSendMail', S.tid, S.adminPw, { subject: M.subject, body: M.body, test: !!test, to: chunk.map(function (x) { return { email: x.email, names: x.names }; }) }, clientMeta())
        .then(function (r) { results = results.concat(r.results); i += size; return step(); });
    };
    return step().then(function () { b.hidden = true; b.innerHTML = orig; return results; }, function (e) { b.hidden = true; b.innerHTML = orig; e.partial = results; throw e; });
  }

    var act = el.getAttribute('data-act');
    var L = S.leagues[S.params.league];

    if (act.indexOf('sys-') === 0) { sysAction(act, el); return; }

    switch (act) {
      case 'open-tournament': {
        var tid = el.getAttribute('data-tid');
        var t = (S.tournaments || []).filter(function (x) { return x.id === tid; })[0];
        if (t) openTournament(t);
        break;
      }
      case 'reload-tournaments':
        loadTournaments().then(render).catch(showError);
        break;
      case 'sys':
        sysLogin();
        break;
      case 'copy':
        copyText(el.getAttribute('data-text'));
        break;
      case 'adm-sample':
        modal({
          title: 'サンプル選手を追加', icon: '🧪',
          html: '<p>テスト用に、参加・支払済みでくじ番号付きのサンプル選手 18 名を「参加者」シートに追加します。</p><p class="small muted">本番の大会では使わないでください。</p>',
