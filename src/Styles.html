<style>
  :root {
    --bg: #f4f6f9;
    --card: #ffffff;
    --text: #1d2433;
    --muted: #667085;
    --line: #e3e7ee;
    --primary: #1f6feb;
    --primary-dark: #1757bd;
    --primary-soft: #e8f0fe;
    --accent: #e8590c;
    --accent-soft: #fff1e6;
    --ok: #18864b;
    --ok-soft: #e6f6ec;
    --warn: #b54708;
    --warn-soft: #fff4e5;
    --danger: #c92a2a;
    --danger-soft: #fdecec;
    --radius: 14px;
    --shadow: 0 1px 2px rgba(16, 24, 40, 0.06), 0 2px 8px rgba(16, 24, 40, 0.06);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", Meiryo, sans-serif;
    font-size: 16px;
    line-height: 1.5;
    -webkit-text-size-adjust: 100%;
  }
  button { font: inherit; color: inherit; cursor: pointer; }
  input, select { font: inherit; }
  .wrap { max-width: 760px; margin: 0 auto; padding: 0 16px 48px; }
  .loading { display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 80px 16px; color: var(--muted); }
  .spinner { width: 32px; height: 32px; border: 3px solid var(--line); border-top-color: var(--primary); border-radius: 50%; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  #busy { position: fixed; inset: 0; background: rgba(255, 255, 255, 0.55); display: flex; align-items: center; justify-content: center; z-index: 60; }
  #busy[hidden] { display: none; }

  /* top bar */
  .topbar { position: sticky; top: 0; z-index: 10; background: rgba(244, 246, 249, 0.94); backdrop-filter: blur(6px); border-bottom: 1px solid var(--line); }
  .topbar-in { max-width: 760px; margin: 0 auto; padding: 10px 16px; display: flex; align-items: center; gap: 10px; min-height: 56px; }
  .topbar h1 { font-size: 18px; margin: 0; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .back { border: 0; background: var(--card); box-shadow: var(--shadow); border-radius: 999px; padding: 6px 14px 6px 10px; font-size: 15px; white-space: nowrap; }
  .chip { font-size: 12px; font-weight: 700; padding: 3px 10px; border-radius: 999px; white-space: nowrap; }
  .chip.player { background: var(--accent-soft); color: var(--accent); }
  .chip.viewer { background: var(--primary-soft); color: var(--primary); }
  .chip.admin { background: #ece8ff; color: #5b3cc4; }
  .icon-btn { border: 0; background: transparent; font-size: 20px; padding: 4px 6px; border-radius: 8px; }

  /* home */
  .home { max-width: 520px; margin: 0 auto; padding: 48px 16px 40px; text-align: center; }
  .hero-ball { font-size: 56px; line-height: 1; }
  .home h1 { font-size: 26px; margin: 12px 0 4px; }
  .home .sub { color: var(--muted); margin: 0 0 32px; }
  .big-btn { display: flex; align-items: center; gap: 16px; width: 100%; text-align: left; border: 0; border-radius: 18px; padding: 22px 20px; margin-bottom: 16px; box-shadow: var(--shadow); transition: transform 0.08s; }
  .big-btn:active { transform: scale(0.98); }
  .big-btn .ico { font-size: 34px; }
  .big-btn b { display: block; font-size: 20px; }
  .big-btn small { display: block; font-size: 14px; opacity: 0.85; }
  .big-btn.player { background: var(--accent); color: #fff; }
  .big-btn.viewer { background: var(--card); color: var(--text); border: 2px solid var(--primary); }
  .admin-link { display: inline-block; margin-top: 28px; color: var(--muted); font-size: 14px; background: none; border: 0; text-decoration: underline; }

  /* common */
  .section-title { font-size: 14px; color: var(--muted); font-weight: 700; margin: 24px 4px 8px; letter-spacing: 0.04em; }
  .card { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px; }
  .card + .card { margin-top: 12px; }
  .muted { color: var(--muted); }
  .small { font-size: 13px; }
  .empty { text-align: center; padding: 32px 16px; color: var(--muted); }
  .btn { white-space: nowrap; display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 0; border-radius: 10px; padding: 10px 18px; font-weight: 700; background: var(--primary-soft); color: var(--primary); min-height: 44px; }
  .btn.primary { background: var(--primary); color: #fff; }
  .btn.accent { background: var(--accent); color: #fff; }
  .btn.danger { background: var(--danger-soft); color: var(--danger); }
  .btn.ghost { background: transparent; color: var(--muted); }
  .btn.block { width: 100%; }
  .btn:disabled { opacity: 0.5; cursor: default; }
  .badge { display: inline-block; font-size: 12px; font-weight: 700; padding: 2px 9px; border-radius: 999px; white-space: nowrap; }
  .badge.none { background: #eef0f4; color: var(--muted); }
  .badge.progress { background: var(--warn-soft); color: var(--warn); }
  .badge.done { background: var(--ok-soft); color: var(--ok); }
  .badge.upper { background: #fff3bf; color: #8a6100; }
  .badge.lower { background: #eef0f4; color: var(--muted); }

  /* tabs */
  .tabs { display: flex; background: #e6e9ef; border-radius: 12px; padding: 4px; margin: 16px 0; }
  .tabs button { flex: 1; border: 0; background: transparent; border-radius: 9px; padding: 10px; font-weight: 700; color: var(--muted); }
  .tabs button.on { background: var(--card); color: var(--text); box-shadow: var(--shadow); }

  /* league grid */
  .league-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
  .league-card { border: 0; text-align: left; background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); padding: 14px; }
  .league-card .ln { font-size: 20px; font-weight: 800; }
  .league-card .meta { font-size: 13px; color: var(--muted); margin: 2px 0 10px; }
  .bar { height: 6px; background: #eef0f4; border-radius: 3px; overflow: hidden; }
  .bar > i { display: block; height: 100%; background: var(--ok); }

  /* name search */
  .search { width: 100%; padding: 12px 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--card); font-size: 16px; }
  .name-list { margin-top: 12px; background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; }
  .name-item { display: flex; align-items: center; gap: 12px; width: 100%; border: 0; border-bottom: 1px solid var(--line); background: transparent; text-align: left; padding: 12px 16px; }
  .name-item:last-child { border-bottom: 0; }
  .num { display: inline-flex; align-items: center; justify-content: center; min-width: 30px; height: 30px; padding: 0 6px; border-radius: 8px; background: #eef0f4; font-weight: 800; font-size: 14px; }
  .name-item .nm { flex: 1; min-width: 0; }
  .name-item .nm small { display: block; color: var(--muted); font-size: 12px; }
  .name-item .lg { font-size: 13px; color: var(--primary); font-weight: 700; white-space: nowrap; }

  /* league view */
  .summary { display: flex; align-items: center; gap: 12px; margin-top: 16px; }
  .summary .bar { flex: 1; }
  .players-row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
  .pchip { border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 4px 12px 4px 4px; font-size: 14px; display: inline-flex; align-items: center; gap: 6px; }
  .pchip .num { min-width: 24px; height: 24px; font-size: 12px; border-radius: 999px; }
  .pchip.on { border-color: var(--accent); background: var(--accent-soft); }
  .focus-banner { display: flex; align-items: center; gap: 8px; margin-top: 12px; padding: 10px 14px; border-radius: 12px; background: var(--accent-soft); color: var(--accent); font-weight: 700; font-size: 14px; }
  .focus-banner span { flex: 1; }
  .focus-banner button { border: 0; background: #fff; border-radius: 999px; padding: 4px 12px; font-size: 13px; color: var(--accent); font-weight: 700; }

  .match { display: block; width: 100%; border: 0; text-align: left; background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); padding: 12px 14px; margin-bottom: 10px; border-left: 5px solid #d0d5dd; }
  .match.st-progress { border-left-color: #f59f00; }
  .match.st-done { border-left-color: var(--ok); }
  .match.mine { box-shadow: 0 0 0 2px var(--accent) inset, var(--shadow); }
  .m-head { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
  .m-head .sp { flex: 1; }
  .m-body { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; margin-top: 6px; }
  .m-pl { font-weight: 700; min-width: 0; overflow-wrap: anywhere; }
  .m-pl.r { text-align: right; }
  .m-pl .num { margin-right: 6px; vertical-align: middle; }
  .m-pl.r .num { margin: 0 0 0 6px; }
  .nb { display: inline-block; }
  .team { font-weight: 400; font-size: 0.85em; color: var(--muted); }
  .m-pl.win { color: var(--ok); }
  .m-pl.win::after { content: " 🏆"; font-size: 13px; }
  .m-pl.r.win::after { content: ""; }
  .m-pl.r.win::before { content: "🏆 "; font-size: 13px; }
  .m-score { font-size: 22px; font-weight: 800; letter-spacing: 0.04em; text-align: center; min-width: 64px; }
  .m-score.vs { font-size: 14px; color: var(--muted); font-weight: 700; }
  .m-sets { font-size: 13px; color: var(--muted); text-align: center; margin-top: 2px; }
  .m-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 8px; }
  .m-actions .btn { min-height: 36px; padding: 6px 14px; font-size: 14px; }

  .result-link { white-space: normal; display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; border: 0; margin-top: 20px; padding: 18px; border-radius: var(--radius); background: var(--primary); color: #fff; font-weight: 800; font-size: 17px; box-shadow: var(--shadow); }

  /* standings */
  .table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); }
  table { border-collapse: collapse; width: 100%; font-size: 14px; }
  th, td { padding: 9px 8px; border-bottom: 1px solid var(--line); text-align: center; white-space: nowrap; }
  th { background: #f8f9fb; font-size: 12px; color: var(--muted); font-weight: 700; }
  td.name, th.name { text-align: left; position: sticky; left: 0; background: var(--card); z-index: 1; }
  th.name { background: #f8f9fb; }
  tr:last-child td { border-bottom: 0; }
  .rank { font-weight: 800; font-size: 16px; }
  .rank-1 { color: #b8860b; }
  .rank-2 { color: #6b7280; }
  .rank-3 { color: #a0522d; }
  tr.adv td { background: #fffbea; }
  tr.adv td.name { background: #fffbea; }
  .cross td.cell { min-width: 58px; padding: 0; }
  .cross td.cell button { width: 100%; height: 100%; min-height: 44px; border: 0; background: transparent; font-weight: 800; padding: 6px 4px; }
  .cross td.self { background: repeating-linear-gradient(45deg, #f1f3f6, #f1f3f6 6px, #e7eaef 6px, #e7eaef 12px); }
  .cross .w { color: var(--ok); }
  .cross .l { color: var(--danger); }
  .cross .p { color: var(--warn); font-size: 12px; }
  .cross .n { color: #c2c8d2; font-weight: 400; }
  .cross .mark { display: block; font-size: 11px; font-weight: 700; }
  .legend { font-size: 12px; color: var(--muted); margin: 8px 4px 0; }
  .provisional { display: inline-block; font-size: 12px; font-weight: 700; padding: 2px 10px; border-radius: 999px; background: var(--warn-soft); color: var(--warn); }
  .final { display: inline-block; font-size: 12px; font-weight: 700; padding: 2px 10px; border-radius: 999px; background: var(--ok-soft); color: var(--ok); }

  /* entry */
  .entry-head { text-align: center; padding: 8px 0 4px; }
  .entry-head .vs { display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; align-items: center; margin-top: 8px; font-weight: 800; font-size: 18px; }
  .entry-head .vs .x { color: var(--muted); font-size: 14px; }
  .notice { padding: 10px 14px; border-radius: 12px; font-size: 14px; margin-top: 12px; }
  .notice.warn { background: var(--warn-soft); color: var(--warn); }
  .notice.info { background: var(--primary-soft); color: var(--primary-dark); }
  .count-row { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); }
  .count-row:last-child { border-bottom: 0; }
  .count-row .who { flex: 1; font-weight: 700; min-width: 0; overflow-wrap: anywhere; }
  .seg { display: inline-flex; gap: 6px; }
  .seg button { width: 44px; height: 44px; border-radius: 10px; border: 1px solid var(--line); background: #fff; font-weight: 800; font-size: 18px; }
  .seg button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .sets-table { width: 100%; }
  .set-row { display: grid; grid-template-columns: 64px 1fr 18px 1fr 28px; gap: 8px; align-items: center; padding: 6px 0; }
  .set-row label { font-size: 13px; color: var(--muted); font-weight: 700; }
  .set-row input { width: 100%; text-align: center; font-size: 20px; font-weight: 800; padding: 8px 4px; border: 1px solid var(--line); border-radius: 10px; background: #fff; }
  .set-row input:focus { outline: 2px solid var(--primary); border-color: transparent; }
  .set-row input.won { background: var(--ok-soft); border-color: #b7e4c7; }
  .set-row .dash { text-align: center; color: var(--muted); }
  .set-row .mk { text-align: center; font-size: 14px; }
  .set-head { display: grid; grid-template-columns: 64px 1fr 18px 1fr 28px; gap: 8px; font-size: 12px; color: var(--muted); font-weight: 700; text-align: center; }
  .set-head span:first-child { text-align: left; }
  .calc { margin-top: 10px; font-size: 14px; color: var(--muted); text-align: right; }
  .calc b { color: var(--text); }
  .calc.bad b { color: var(--danger); }
  .entry-actions { display: grid; grid-template-columns: minmax(110px, 1fr) 2fr; gap: 10px; margin-top: 20px; }
  .reset-link { display: block; margin: 20px auto 0; border: 0; background: none; color: var(--danger); text-decoration: underline; font-size: 14px; }

  /* modal */
  .modal-bg { position: fixed; inset: 0; background: rgba(16, 24, 40, 0.5); display: flex; align-items: flex-end; justify-content: center; z-index: 50; animation: fade 0.15s; }
  @media (min-width: 600px) { .modal-bg { align-items: center; } }
  @keyframes fade { from { opacity: 0; } }
  .modal { background: var(--card); width: 100%; max-width: 480px; max-height: 88vh; overflow: auto; border-radius: 18px 18px 0 0; padding: 20px 18px calc(18px + env(safe-area-inset-bottom)); }
  @media (min-width: 600px) { .modal { border-radius: 18px; } }
  .modal h2 { font-size: 18px; margin: 0 0 10px; display: flex; align-items: center; gap: 8px; }
  .modal .body { font-size: 15px; }
  .modal .body ul { padding-left: 20px; margin: 8px 0; }
  .modal .actions { display: flex; flex-direction: column-reverse; gap: 8px; margin-top: 18px; }
  @media (min-width: 600px) { .modal .actions { flex-direction: row; justify-content: flex-end; } }
  .modal .actions .btn { width: 100%; }
  @media (min-width: 600px) { .modal .actions .btn { width: auto; } }
  .detail-score { display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; align-items: center; text-align: center; margin: 8px 0 14px; }
  .detail-score .pn { font-weight: 700; }
  .detail-score .sc { font-size: 32px; font-weight: 800; }
  .detail-sets td { font-size: 16px; }
  .detail-sets td.w { color: var(--ok); font-weight: 800; }

  #toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(120px); background: #1d2433; color: #fff; padding: 12px 20px; border-radius: 12px; font-weight: 700; z-index: 70; transition: transform 0.25s, visibility 0.25s; visibility: hidden; max-width: calc(100% - 32px); text-align: center; }
  #toast.show { transform: translateX(-50%) translateY(0); visibility: visible; }

  /* admin */
  .form-row { margin-bottom: 14px; }
  .form-row label { display: block; font-size: 14px; font-weight: 700; margin-bottom: 4px; }
  .form-row .hint { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .form-row input, .form-row select { width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: #fff; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 12px; }
  @media (max-width: 420px) { .grid2 { grid-template-columns: 1fr; } }
  .stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 8px; }
  .stat { background: #f8f9fb; border-radius: 10px; padding: 10px; text-align: center; }
  .stat b { display: block; font-size: 22px; }
  .stat small { font-size: 12px; color: var(--muted); }
  .preview { margin-top: 10px; font-size: 14px; }
  .preview .sizes { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .preview .sizes span { background: var(--primary-soft); color: var(--primary-dark); padding: 2px 10px; border-radius: 999px; font-size: 13px; font-weight: 700; }
  .list-plain { margin: 6px 0 0; padding-left: 18px; font-size: 14px; }
  .row-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }

  /* tournament */
  .wrap.wide { max-width: 1100px; }
  .phase { display: flex; gap: 8px; margin-top: 16px; }
  .phase button { flex: 1; border: 2px solid var(--line); background: var(--card); border-radius: 12px; padding: 10px; font-weight: 800; color: var(--muted); }
  .phase button.on { border-color: var(--primary); color: var(--primary); background: var(--primary-soft); }
  .tour-grid { grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); margin-top: 16px; }
  .tour-card .ln { font-size: 18px; }
  .champ-banner { margin-top: 12px; padding: 12px 16px; border-radius: 12px; background: #fff3bf; color: #7a5600; font-size: 15px; }
  .table-tag { font-size: 12px; color: var(--primary-dark); background: var(--primary-soft); padding: 2px 8px; border-radius: 999px; white-space: nowrap; }
  .table-big { display: inline-block; margin-top: 8px; background: var(--primary); color: #fff; font-weight: 800; font-size: 18px; padding: 4px 16px; border-radius: 999px; }
  .board { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 8px; }
  .tbl { text-align: left; border: 0; background: var(--card); border-radius: 12px; box-shadow: var(--shadow); padding: 10px 12px; border-top: 4px solid #d0d5dd; min-height: 96px; }
  .tbl.playing { border-top-color: #f59f00; }
  .tbl.called { border-top-color: var(--primary); }
  .tbl.empty { background: #f8f9fb; box-shadow: none; border: 1px dashed var(--line); border-top: 4px solid var(--line); }
  .tbl.extra { opacity: 0.75; }
  .tno { font-weight: 800; font-size: 16px; display: flex; align-items: center; gap: 6px; }
  .tpl { font-size: 13px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tpl .team, .qnames .team { font-weight: 400; }
  .queue { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; }
  .qitem { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; width: 100%; border: 0; border-bottom: 1px solid var(--line); background: transparent; text-align: left; padding: 9px 12px; font-size: 14px; }
  .qitem:last-child { border-bottom: 0; }
  .qno { display: inline-flex; align-items: center; justify-content: center; width: 24px; height: 24px; border-radius: 999px; background: var(--primary); color: #fff; font-weight: 800; font-size: 12px; flex: none; }
  .qnames { flex: 1 1 100%; padding-left: 32px; font-weight: 700; font-size: 14px; }
  .bracket-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); padding: 12px; }
  .bracket { position: relative; }
  .blines { position: absolute; left: 0; top: 0; pointer-events: none; }
  .blines path { fill: none; stroke: #c9ced8; stroke-width: 2; }
  .blines path.done { stroke: var(--ok); }
  .rlabel { position: absolute; top: 0; text-align: center; font-size: 12px; font-weight: 800; color: var(--muted); }
  .bm { position: absolute; border: 1px solid var(--line); background: #fff; border-radius: 10px; padding: 0; text-align: left; overflow: visible; display: flex; flex-direction: column; justify-content: center; box-shadow: 0 1px 2px rgba(16,24,40,.05); }
  .bm.st-progress { border-color: #f59f00; box-shadow: 0 0 0 2px #ffe8a3; }
  .bm.ontable.st-none { border-color: var(--primary); }
  .bm.bye { background: #f8f9fb; border-style: dashed; }
  .bm.mine { box-shadow: 0 0 0 3px var(--accent); }
  .brow { display: flex; align-items: center; gap: 6px; padding: 0 8px; height: 28px; font-size: 13px; }
  .brow + .brow { border-top: 1px solid var(--line); }
  .brow.won { font-weight: 800; color: var(--ok); }
  .brow.lost { color: #98a2b3; }
  .brow.me .bname { text-decoration: underline; text-decoration-color: var(--accent); text-decoration-thickness: 2px; }
  .seed { width: 18px; flex: none; font-size: 11px; color: var(--muted); text-align: center; font-weight: 700; }
  .bname { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bname .nb { display: inline; }
  .bsc { width: 16px; text-align: right; font-weight: 800; }
  .btag { position: absolute; right: 6px; top: -9px; font-size: 10px; font-weight: 800; background: var(--primary); color: #fff; border-radius: 999px; padding: 1px 7px; white-space: nowrap; }
